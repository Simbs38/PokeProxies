// The Sheet holds one row per Gen 1 form and one per 30th card, so it reads like a checklist.
// Rows are matched back by name / card id, not position, so a reordered data.js still lands right.
const UNSORTED = "Unsorted";
const label = c => c ? `${c.id} (${c.set} ${c.number}/${c.total ?? "?"})` : "";
const idsIn = cell => String(cell || "").split("\n").map(l => l.split(" ")[0]).filter(Boolean);

function tabsOut() {
  const placed = new Set();
  const gen1 = COLLECTIONS.gen1.items.map(p => {
    const all = cardsFor(p) || [], mine = all.filter(c => have.has(c.id)), fav = favs["gen1:" + p.i];
    mine.forEach(c => placed.add(c.id));
    return [p.name, mine.length ? "✓" : "", mine.map(label).join("\n"),
            fav ? label(all.find(c => c.id === fav.id)) || fav.id : ""];
  });
  const anniv = COLLECTIONS.anniv.items.map(c => {
    if (have.has(c.id)) placed.add(c.id);
    return [c.name, have.has(c.id) ? "✓" : "", c.id, `${c.number}/${c.total ?? "?"}`, c.rarity, c.section];
  });
  // owned cards no row claims (a filter change, a dropped species) park here instead of vanishing
  const byId = new Map(Object.values(DEX.tcg).flat().map(c => [c.id, c]));
  const rest = [...have].filter(id => !placed.has(id));
  gen1.push([UNSORTED, "", rest.map(id => label(byId.get(id)) || id).join("\n"), ""]);
  return { tabs: { gen1, anniv }, decks: decks.map(deckSheet) };
}

// One tab per deck: its cards in A–F; on the right (H–I) the deck's facts, then its versions.
function deckSheet(d, order) {
  const s = deckProfile(d)?.score, arch = archetype(expand(d.cards)), price = deckPrice(d);
  const fs = ENG.roles(expand(d.cards), d.roles);
  const role = l => { const c = cardOf(l), f = c?.c === "P" && fs.find(f => f.root === c.root); return f ? ROLE[f.role] : "" };
  const grid = [["Qty", "Card", "Card ID", "Category", "Role", "Cover"],
    ...d.cards.map(l => [String(l.n), l.name, l.id, l.cat, role(l), l.id === d.cover ? "✓" : ""])];
  const facts = [["Deck", d.name], ["Total", s ? `${s.total} · ${s.tier}` : ""],
    ...Object.entries(FACTOR).map(([k, t]) => [t, s ? String(s[k]) : ""]),
    ["Archetype", arch ? `${arch.m.name} · ${perc(arch.sim)}` : ""], ["Price", d.cards.length ? money(price.eur) : ""],
    ["Tags", d.tags.join(", ")], ["Notes", d.notes || ""], ["Order", String(order)],
    ["Roles", Object.entries(d.roles).map(([k, v]) => `${k}=${v}`).join("; ")], ["Versions", String(d.versions.length)],
    ...d.versions.map(v => [new Date(v.t).toISOString().slice(0, 16) + (v.label ? " — " + v.label : ""), v.list])];
  const rows = [];
  for (let r = 0; r < Math.max(grid.length, facts.length); r++) rows.push([...(grid[r] || ["", "", "", "", "", ""]), "", ...(facts[r] || ["", ""])]);
  return { name: d.name, rows };
}

function deckFromSheet(name, rows) {
  const d = { name, notes: "", cover: null, cards: [], tags: [], roles: {}, versions: [], order: 0 };
  let versions = false;
  rows.forEach((r, i) => {
    if (i && r[2]) { d.cards.push({ id: r[2], n: +r[0] || 1, name: r[1], cat: r[3] || "Trainer" }); if (r[5]) d.cover = r[2] }
    const [k, v = ""] = [r[7], r[8]];
    if (!k) return;
    if (versions) {
      const [when, label = ""] = k.split(" — ");
      d.versions.push({ t: Date.parse(when + "Z") || 0, label, list: v });
    } else if (k === "Notes") d.notes = v;
    else if (k === "Tags") d.tags = v.split(/,\s*/).filter(Boolean);
    else if (k === "Order") d.order = +v || 0;
    else if (k === "Roles") v.split(/;\s*/).forEach(x => { const [root, role] = x.split("="); if (root && role) d.roles[root] = role });
    else if (k === "Versions") versions = true;
  });
  return d;
}

function fromTabs(r) {
  const t = r.tabs, byName = new Map(COLLECTIONS.gen1.items.map(p => [p.name, p]));
  const d = { have: [], favs: {} };
  for (const [name, , ids, fav] of t.gen1 || []) {
    d.have.push(...idsIn(ids));
    const p = byName.get(name), id = idsIn(fav)[0];
    if (p && id) d.favs["gen1:" + p.i] = { id, img: CARD_IMG(id) };
  }
  for (const [, own, id] of t.anniv || []) if (own) d.have.push(id);
  if (r.decks.length) d.decks = r.decks.map(x => deckFromSheet(x.name, x.rows)).sort((a, b) => a.order - b.order);
  else {                                 // the earlier single Decks tab, read once before the switch
    const byDeck = new Map();
    for (const [deck, qty, name, id, cat, cover, notes] of r.oldDecks || []) {
      if (!deck) continue;
      if (!byDeck.has(deck)) byDeck.set(deck, { name: deck, notes: "", cover: null, cards: [], tags: [], roles: {}, versions: [] });
      const dk = byDeck.get(deck);
      if (notes) dk.notes = notes;
      if (id) dk.cards.push({ id, n: +qty || 1, name, cat });
      if (id && cover) dk.cover = id;
    }
    d.decks = [...byDeck.values()];
  }
  d.decks.forEach(x => delete x.order);
  return d;
}

function applyState(d) {
  have.clear(); (d.have || []).forEach(x => have.add(x));
  Object.keys(favs).forEach(k => delete favs[k]);
  Object.entries(d.favs || {}).forEach(([k, v]) => { if (k.split(":")[0] in COLLECTIONS) favs[k] = v });
  if (d.decks) {                 // the old state JSON and older backups carry none: keep this device's
    decks.splice(0, decks.length, ...d.decks);
    decks.forEach(x => { x.tags ||= []; x.roles ||= {}; x.versions ||= [] });
    open &&= decks.find(x => x.name === open.name) || null;
  }
  save(false); render();
}

const status = (t, on) => { sync.textContent = t; sync.title = t; sync.classList.toggle("on", !!on) };

async function pull() {
  if (!cfg.url || !cfg.tok) return status("☁ Sign in");
  status("☁ Syncing…");
  try {
    const d = await (await fetch(`${cfg.url}?v=3&idToken=${encodeURIComponent(cfg.tok)}`)).json();
    if (!d.ok) {
      if (/sign in/i.test(d.error || "")) { cfg.tok = ""; store.set("syncTok", ""); applyLock() }
      throw new Error(d.error || "rejected");
    }
    // an older script would misread this site's saves (a blob, one Decks tab) and hand back no
    // decks, wiping this device's on apply -> never sync with one
    if (d.v !== 3) throw new Error("update the Apps Script first");
    cfg.ready = true;
    // whichever side was written last wins — plain and predictable for one person, two devices.
    // No tabs yet = first run on the new script: the old state JSON comes along once to fill them.
    const remote = d.tabs ? fromTabs(d) : d.legacy;
    if (remote && (d.updated || 0) > store.get("updated", 0)) {
      applyState(remote);
      store.set("updated", d.updated);
    }
    if (!d.tabs || store.get("updated", 0) > (d.updated || 0)) push(0);
    status("☁ Synced", true);
  } catch (e) { status("☁ " + e.message) }
}

function push(wait = 900) {
  if (!cfg.url || !cfg.tok || !cfg.ready) return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const updated = Date.now();
    status("☁ Saving…");
    try {
      // text/plain keeps it a simple request: no CORS preflight, which Apps Script cannot answer
      const d = await (await fetch(cfg.url, {
        method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ idToken: cfg.tok, v: 3, updated, ...tabsOut() }),
      })).json();
      if (!d.ok) throw new Error(d.error || "rejected");
      store.set("updated", updated);
      status("☁ Synced", true);
    } catch (e) { status("☁ " + e.message) }
  }, wait);
}

// A GitHub Action re-runs fetch_data.py and republishes the site; the Apps Script starts it, since it

const RUNS = "https://api.github.com/repos/Simbs38/PokeProxies/actions/workflows/refresh-data.yml/runs?per_page=6";
let runs = null, runsT, refreshMsg = "";
async function loadRuns() {
  try { runs = (await (await fetch(RUNS)).json()).workflow_runs || [] } catch { runs = [] }
  if (cur !== "data") return;
  renderData();
  clearTimeout(runsT);

}
async function refreshData() {
  refreshMsg = "Starting a refresh…"; renderData();
  try {
    // no sync version on purpose: an older script answers "reload" instead of reading it as a save
    const d = await (await fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ idToken: cfg.tok, action: "refresh" }) })).json();
    refreshMsg = d.ok ? "Started. Fetching takes about 5–10 minutes, then the site republishes itself — reload this page once the run below shows ✓."
      : /reload/.test(d.error || "") ? "Your Apps Script is the previous version — paste the new one and deploy it first."
      : "Couldn't start: " + d.error;
  } catch (e) { refreshMsg = "Couldn't start: " + e.message }
  renderData(); setTimeout(loadRuns, 5000);
}

  };

    return `<div class="run"><b class="${r.conclusion === "success" ? "ok" : r.status !== "completed" ? "" : "bad"}">${icon}</b>
      <span>${new Date(r.created_at).toLocaleString()} · ${r.event === "schedule" ? "weekly" : "manual"}${mins ? ` · ${mins} min` : ""}</span>

  dataview.innerHTML = `

        and republish the site; they also run by themselves every Monday.</div></div>

    </div>
    ${refreshMsg ? `<p class="sub refresh-msg">${esc(refreshMsg)}</p>` : ""}
    <div class="data-grid">
      <div class="dcard"><h3>Cards &amp; sets</h3>
        <div class="big"><b>${CARDS.cards.length.toLocaleString()}</b> Standard-legal cards · ${prints.toLocaleString()} prints ·
          ${Object.keys(CARDS.sets).length} sets · regulation marks ${(CARDS.legal || []).join(", ")}</div>
        <div class="sub">From pokemontcg.io, with Cardmarket and TCGplayer prices · fetched ${esc(CARDS.fetched || "—")}</div>${age(CARDS.fetched)}
        <div class="sets">${Object.values(CARDS.sets).sort().map(n => `<span>${esc(n)}</span>`).join("")}</div></div>
      <div class="dcard"><h3>Meta</h3>
        <div class="big"><b>${META.decks.length}</b> archetypes · ${(META.events || 0).toLocaleString()} events ·
          ${(META.players || 0).toLocaleString()} players · ${(META.mu || []).length.toLocaleString()} real matchups</div>
        <div class="sub">Limitless online Standard events, last ${META.days || "?"} days · fetched ${esc(META.fetched || "—")}</div>${age(META.fetched)}
        <table class="arch-t"><tr><td class="lbl">Top archetypes</td><td class="lbl">share</td><td class="lbl">wins</td></tr>
          ${META.decks.slice(0, 12).map(m => `<tr><td>${esc(m.name)}</td><td>${m.share}%</td><td>${m.win != null ? m.win + "%" : "—"}</td></tr>`).join("")}</table></div>
      <div class="dcard"><h3>Collection</h3>
        <div class="big"><b>${COLLECTIONS.gen1.items.length}</b> Gen 1 entries · <b>${COLLECTIONS.anniv.items.length}</b> 30th Celebration cards</div>
        <div class="sub">Card lists and prices for the collection tabs · fetched ${esc(DEX.fetched || "—")}</div>${age(DEX.fetched)}</div>
      <div class="dcard"><h3>Refresh runs</h3>

    </div>`;
}

  if (!cfg.tok) { login.hidden = false; drawGsi() }
}

sync.onclick = () => {
  document.getElementById("l-msg").textContent = "";
  login.hidden = false;
  drawGsi();
};
login.addEventListener("click", e => { if (e.target === login && cfg.tok) login.hidden = true });
document.getElementById("l-out").onclick = () => {
  cfg.tok = "";
  store.set("syncTok", "");
  window.google?.accounts?.id?.disableAutoSelect();
  status("☁ Sign in"); applyLock();
};
addEventListener("load", drawGsi);
applyLock();

applyPrefs();
render();
pull();
</script>
