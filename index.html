<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex Proxies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0a0c14;
    --fg: #eef1f7;
    --dim: #98a0b5;
    --card: rgba(255,255,255,.045);
    --line: rgba(255,255,255,.09);
    --acc: #ffcb05;
    --blue: #3b7dd8;
    --r: 18px;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; color: var(--fg); background: var(--bg);
    font: 16px/1.45 Outfit, system-ui, sans-serif;
    background-image:
      radial-gradient(60rem 30rem at 12% -10%, #2a75bb44, transparent 70%),
      radial-gradient(50rem 26rem at 92% 0%, #ffcb0522, transparent 70%);
    background-attachment: fixed;
  }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 14px 22px;
    background: rgba(10,12,20,.72);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 800; letter-spacing: -.02em; margin-right: 14px; font-size: 20px }
  .logo em { color: var(--acc); font-style: normal }
  nav { display: flex; gap: 8px; flex-wrap: wrap; order: 2 }
  .logo { order: 1 }
  .toolbar { order: 3; margin-left: auto; display: flex; gap: 8px }
  #burger { order: 0 }
  .narrow { display: none }
  /* the ☰ menu: view settings on top, one-off tools below */
  .tools {
    position: absolute; top: 100%; left: 22px; z-index: 30;
    display: none; flex-direction: column; align-items: stretch; gap: 6px;
    width: 250px; padding: 10px; border-radius: 14px;
    background: #11141d; border: 1px solid var(--line);
    box-shadow: 0 20px 44px -20px #000;
  }
  body.menu .tools { display: flex }
  .tools .pill { text-align: left }
  .tools .lbl { font-size: 11px; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; margin: 2px 4px -2px }
  .tools hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
  .seg { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--card) }
  .seg button {
    flex: 1; padding: 6px 0; border: 0; border-radius: 999px; background: none; cursor: pointer;
    font: 600 12px Outfit, sans-serif; color: var(--dim); transition: .18s;
  }
  .seg button:hover { color: var(--fg) }
  .seg button.on { color: #16181f; background: linear-gradient(180deg, #ffe066, var(--acc)) }
  .pill {
    font: 600 14px Outfit, sans-serif; color: var(--dim);
    padding: 9px 18px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); cursor: pointer; transition: .18s;
  }
  .pill.sm { padding: 7px 13px; font-size: 12px }
  .pill:hover { color: var(--fg); border-color: #ffffff30 }
  .pill.on {
    color: #16181f; border-color: transparent; box-shadow: 0 6px 22px -8px var(--acc);
    background: linear-gradient(180deg, #ffe066, var(--acc));
  }

  #banner { display: grid; gap: 14px; padding: 26px 22px 8px; grid-template-columns: minmax(240px, 320px) 1fr }
  .hero, .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(6px) }
  .hero { display: flex; gap: 18px; align-items: center; padding: 20px }
  .ring {
    --p: 0; position: relative; flex: 0 0 96px; width: 96px; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
    background: conic-gradient(var(--acc) calc(var(--p) * 1%), rgba(255,255,255,.08) 0);
  }
  .ring::before { content: ""; position: absolute; width: 76px; aspect-ratio: 1; border-radius: 50%; background: #12141d }
  .ring > span { position: relative }
  .hero h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; color: var(--dim) }
  .hero .big { font-size: 30px; font-weight: 800; letter-spacing: -.02em }
  .hero .sub { font-size: 13px; color: var(--dim) }

  .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) }
  .stat { padding: 14px 16px }
  .stat .t { font-size: 13px; color: var(--dim); display: flex; justify-content: space-between }
  .stat .v { font-size: 20px; font-weight: 700; margin: 2px 0 8px }
  .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--acc)) }

  #list {
    --cols: 3;   /* Card Row Size, set from the menu */
    padding: 22px; display: grid; gap: clamp(3px, calc(36px / var(--cols)), 14px);
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  }
  #list.cardsgrid .tcg { width: 100% }
  .tcg .idx {
    position: absolute; top: 6px; left: 8px; z-index: 1; font-size: 9px; color: var(--dim);
    background: rgba(12,15,22,.7); padding: 1px 5px; border-radius: 5px;
  }
  .card {
    position: relative; border: 1px solid var(--line); border-radius: 13px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    padding: 7px 7px 9px; cursor: pointer; transition: transform .18s, border-color .18s, box-shadow .18s;
    text-align: center; user-select: none;
  }
  .card:hover { transform: translateY(-4px); border-color: #ffffff2b; box-shadow: 0 18px 30px -20px #000 }
  .card .idx { position: absolute; top: 7px; left: 8px; font-size: 9px; color: var(--dim) }
  .card .tick {
    position: absolute; top: 6px; right: 6px; width: 17px; height: 17px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: transparent;
  }
  .card > img {
    width: 100%; aspect-ratio: 1; object-fit: contain; display: block;
    filter: drop-shadow(0 10px 14px #0008);
    background: radial-gradient(closest-side, rgba(255,255,255,.09), transparent 72%);
  }
  .card .dex { font-size: 10px; color: var(--acc); font-weight: 600 }
  .card .row { display: flex; gap: 4px; align-items: center; justify-content: center; margin-top: 1px; flex-wrap: wrap }
  .card .cnt {
    font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 5px;
    background: rgba(59,125,216,.22); color: #bcd6ff; white-space: nowrap;
  }
  .card .name { font-weight: 600; font-size: 11px; line-height: 1.15 }
  .card .mini {
    width: 15px; aspect-ratio: 245/342; object-fit: cover; border-radius: 3px;
    box-shadow: 0 0 0 1px var(--acc), 0 0 8px -1px var(--acc);
  }
  .card .cards { margin-top: 6px; width: 100%; padding: 5px 6px; font-size: 10px }
  .card .form {
    display: inline-block; margin-top: 4px; padding: 1px 6px; border-radius: 99px;
    font-size: 8px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    background: rgba(255,255,255,.08); color: var(--dim);
  }
  .card.done { border-color: var(--acc); background: linear-gradient(180deg, #ffcb0522, rgba(255,255,255,.02)) }
  .card.done .tick { background: var(--acc); border-color: var(--acc); color: #16181f }
  .empty { padding: 60px 22px; color: var(--dim); grid-column: 1/-1; text-align: center }
  .hero .filt { color: var(--acc) }
  footer { padding: 8px 22px 40px; color: var(--dim); font-size: 12px }

  /* ---- tiles size with Card Row Size: text grows at about half the rate of the tile, so 2-up
     stays proportionate and 10-up stays tidy; small tiles drop the fine print ---- */
  #list .card, #list .tcg { container-type: inline-size; padding: clamp(3px, 6%, 14px) }
  #list .card .idx   { font-size: clamp(7px, calc(4.5px + 4.7cqi), 14px) }
  #list .card .tick  { width: clamp(15px, calc(9px + 8.4cqi), 30px); height: auto; aspect-ratio: 1; font-size: clamp(9px, calc(5px + 5.3cqi), 17px) }
  #list .card .dex   { font-size: clamp(8px, calc(5px + 5.3cqi), 17px) }
  #list .card .cnt   { font-size: clamp(7px, calc(4.5px + 4.7cqi), 14px) }
  #list .card .name  { font-size: clamp(9px, calc(5.5px + 5.8cqi), 20px) }
  #list .card .mini  { width: clamp(12px, calc(7.5px + 7.9cqi), 28px) }
  #list .card .cards { font-size: clamp(8px, calc(5px + 5.3cqi), 16px); padding: .5em .6em; white-space: nowrap }
  #list .card .form  { font-size: clamp(7px, calc(4px + 4.2cqi), 13px) }
  #list .tcg .idx    { font-size: clamp(7px, calc(4.5px + 3.5cqi), 13px) }
  #list .tcg .n      { font-size: clamp(9px, calc(6.5px + 5cqi), 20px) }
  #list .tcg .s      { font-size: clamp(8px, calc(5.5px + 4.2cqi), 15px) }
  #list .tcg .p      { font-size: clamp(11px, calc(8px + 6.2cqi), 26px) }
  #list .tcg .p small { font-size: clamp(7px, calc(5px + 3.8cqi), 13px) }
  #list .tcg .own    { font-size: clamp(9px, calc(6px + 4.6cqi), 17px); padding: .65em .5em }
  @container (max-width: 72px) {
    #list .card :is(.idx, .dex, .row, .form) { display: none }
    #list .card .cards { margin-top: 3px; padding: .3em 0 }
  }
  @container (max-width: 44px) { #list .card :is(.tick, .cards) { display: none } }
  @container (max-width: 100px) { #list .tcg :is(.s, .p, .own) { display: none } }
  @container (max-width: 56px) { #list .tcg :is(.idx, .n) { display: none } }

  /* ---- touch fast-scroll: a thumb on the right edge, shown while scrolling, drag to jump ---- */
  #scrub {
    position: fixed; top: 0; right: 4px; z-index: 6; width: 30px; height: 54px;
    display: grid; place-items: center; touch-action: none; cursor: grab;
    border-radius: 99px; background: rgba(17,20,29,.92); border: 1px solid #ffffff30;
    box-shadow: 0 8px 22px -10px #000; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #scrub::before { content: ""; width: 6px; height: 18px; border: solid var(--dim); border-width: 0 2px }
  #scrub.on { opacity: 1; pointer-events: auto }
  #scrub span {
    position: absolute; right: 40px; display: none; white-space: nowrap; padding: 6px 12px;
    border-radius: 99px; font-weight: 700; font-size: 14px; color: #16181f; background: var(--acc);
  }
  #scrub.drag span { display: block }

  /* ---- variations modal ---- */
  #modal, #login, #dlg {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 2vh 6px;
    background: rgba(4,6,12,.74); backdrop-filter: blur(6px);
  }
  #modal[hidden], #login[hidden], #dlg[hidden] { display: none }
  .box {
    width: min(1180px, 96vw); max-height: 94vh; overflow: auto;
    border: 1px solid var(--line); border-radius: 22px; background: #11141d;
  }
  .m-head { display: flex; gap: 14px; align-items: center; padding: 18px 20px 14px }
  .m-head > img { width: 56px; height: 56px; object-fit: contain }
  .m-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em }
  .m-head .sub { font-size: 13px; color: var(--dim) }
  .m-head .x {
    margin-left: auto; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 16px;
  }
  .m-tools { display: flex; gap: 8px; align-items: center; padding: 0 20px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
  .m-tools span { font-size: 12px; color: var(--dim); margin-right: 2px }
  .m-tools .pill { padding: 6px 14px; font-size: 13px }
  .m-body { display: flex; align-items: center; gap: 4px; padding: 16px 6px 22px }
  .m-body > div { flex: 1; min-width: 0 }
  .strip {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity;
    padding: 6px 20px 14px; scrollbar-width: thin;
  }
  .tcg {
    position: relative; flex: 0 0 190px; scroll-snap-align: start; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center;
  }
  .tcg img { width: 100%; aspect-ratio: 245/342; object-fit: contain; border-radius: 8px; background: #0006 }
  .tcg .n { font-weight: 600; font-size: 13px; margin-top: 8px; line-height: 1.2 }
  .tcg .s { font-size: 11px; color: var(--dim); margin-top: 3px }
  .tcg .p { margin-top: 7px; font-weight: 800; color: var(--acc) }
  .tcg .p small { display: block; font-weight: 400; font-size: 10px; color: var(--dim); text-transform: uppercase }
  .tcg { cursor: pointer }
  .tcg .own {
    margin-top: 9px; padding: 8px 6px; border-radius: 10px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--dim);
  }
  .tcg .star {
    position: absolute; top: 6px; right: 6px; z-index: 2; width: 34px; height: 34px; cursor: pointer;
    border-radius: 50%; border: 1px solid var(--line); background: rgba(12,15,22,.85); color: var(--dim);
    font-size: 15px;
  }
  .tcg.have { border-color: #4ade80; background: rgba(74,222,128,.10) }
  .tcg.have .own { background: #4ade80; border-color: #4ade80; color: #0c1a10 }
  .tcg.fav {
    border-color: var(--acc);
    box-shadow: 0 0 0 1px var(--acc), 0 0 22px -2px var(--acc), inset 0 0 26px -14px var(--acc);
    animation: glow 1.8s ease-in-out infinite alternate;
  }
  .tcg.fav .star { background: var(--acc); border-color: var(--acc); color: #16181f }
  @keyframes glow { to { box-shadow: 0 0 0 1px var(--acc), 0 0 34px 2px var(--acc), inset 0 0 26px -10px var(--acc) } }
  .arrow {
    flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: rgba(20,23,32,.9); color: var(--fg); font-size: 16px;
  }
  .msg { padding: 40px 20px; text-align: center; color: var(--dim) }
  #login input {
    width: 100%; margin-top: 8px; padding: 11px 13px; font: 400 14px Outfit, sans-serif;
    color: var(--fg); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 12px;
  }
  /* ---- signed-out gate: the sync dialog becomes the whole page ---- */
  body.locked > header, body.locked > #banner, body.locked > #list, body.locked > #deckview, body.locked > #dataview,
  body.locked > footer { display: none }
  body.locked #login { background: none; backdrop-filter: none }
  #login .brand { display: none; font-weight: 800; font-size: 26px; letter-spacing: -.02em; margin-bottom: 10px }
  #login .brand em { color: var(--acc); font-style: normal }
  body.locked #login .brand { display: block }
  body.locked #l-out { display: none }
  body.overview #list, body.overview footer { display: none }
  body:not(.overview) #banner { grid-template-columns: 1fr }

  /* ---- deckbuilder: My Decks list, then an editor with the card picker beside the deck ---- */
  body.decking :is(#banner, #list, footer), body:not(.decking) #deckview { display: none }
  body.datapage :is(#banner, #list, footer), body:not(.datapage) #dataview { display: none }
  #dataview { padding: 22px }
  #dataview .sub { font-size: 13px; color: var(--dim) }
  .data-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) }
  .dcard { padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card) }
  .dcard h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em }
  .dcard .big { font-size: 15px; line-height: 1.5 }
  .dcard .big b { font-size: 22px }
  .fresh { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; color: #16181f }
  .fresh.ok { background: #4ade80 } .fresh.mid { background: #fbbf24 } .fresh.old { background: #f87171 }
  .sets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px }
  .sets span { padding: 1px 8px; border-radius: 99px; font-size: 11px; background: rgba(255,255,255,.08); color: var(--dim) }
  .arch-t { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px }
  .arch-t td { padding: 3px 4px; border-top: 1px solid var(--line) }
  .arch-t td:not(:first-child) { text-align: right; color: var(--dim) }
  .run { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px }
  .run a { margin-left: auto; color: var(--acc) }
  .refresh-msg { margin: 0 0 14px }
  #deckview { --hh: 64px; padding: 22px }
  #deckview .sub, #dlg .sub { font-size: 13px; color: var(--dim) }
  .dk-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px }
  .dk-head > div { margin-right: auto }
  .dk-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em }
  .dk-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
  .deck {
    display: flex; gap: 14px; padding: 12px; cursor: pointer; transition: .18s;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--card);
  }
  .deck:hover { border-color: #ffffff2b; transform: translateY(-2px) }
  .deck .dimg { flex: 0 0 92px }
  .deck .dimg img { width: 92px; aspect-ratio: 245/342; object-fit: cover; border-radius: 7px; display: block }
  .deck .dbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
  .deck .dn { font-weight: 700; font-size: 17px; overflow-wrap: anywhere }
  .deck .ds { font-size: 12px; color: var(--dim) }
  .deck .ds b { color: var(--fg) }
  .deck .dw { font-size: 12px; color: #fbbf24 }
  .deck .dok { font-size: 12px; color: #4ade80 }
  .deck .dnote {
    font-size: 12px; color: var(--dim); white-space: pre-line; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .deck .da { margin-top: auto; padding-top: 6px; display: flex; gap: 6px; flex-wrap: wrap }

  .ed { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start }
  .ed-bar { grid-column: 1/-1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
  .eb-name { font-weight: 700; font-size: 18px; overflow-wrap: anywhere }
  .eb-tally { margin-left: auto; font-size: 13px; color: var(--dim) }
  .eb-tally b { color: var(--fg) }
  .eb-tally .ok { color: #4ade80 }
  .eb-tally .warn { color: #fbbf24 }
  .eb-pane { display: none }
  .pk-tools { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px }
  .pk-cat { max-width: 420px }
  :is(#pk-q, .dk-name, .dk-notes, #imp-name, #imp-text, #exp-text) {
    width: 100%; padding: 10px 13px; font: 400 14px Outfit, sans-serif; color: var(--fg);
    background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap }
  .chip {
    display: inline-flex; gap: 5px; align-items: center; padding: 5px 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    font: 600 12px Outfit, sans-serif; color: var(--dim); transition: .15s;
  }
  .chip:hover { color: var(--fg) }
  .chip i { width: 9px; height: 9px; border-radius: 50% }
  .chip.on { color: #16181f; background: var(--acc); border-color: var(--acc) }
  .pk-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)) }
  .pk { position: relative; cursor: pointer; user-select: none; transition: transform .15s }
  .pk:hover { transform: translateY(-3px) }
  .pk img { width: 100%; aspect-ratio: 245/342; object-fit: cover; border-radius: 7px; display: block; background: #0006 }
  .pk.in img { box-shadow: 0 0 0 2px var(--acc), 0 0 16px -4px var(--acc) }
  .pk .qty {
    position: absolute; top: 5px; left: 5px; padding: 1px 7px; border-radius: 99px;
    font-weight: 800; font-size: 13px; color: #16181f; background: var(--acc);
  }
  .pk .qty:empty { display: none }
  .pk .zm {
    position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; cursor: pointer;
    border-radius: 50%; border: 1px solid var(--line); background: rgba(12,15,22,.85); font-size: 13px;
  }
  .pk .pn { margin-top: 4px; font-size: 11px; font-weight: 600; line-height: 1.2; text-align: center }

  .dk {
    position: sticky; top: calc(var(--hh) + 14px); max-height: calc(100vh - var(--hh) - 28px); overflow: auto;
    display: flex; flex-direction: column; gap: 10px; padding: 14px;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--card);
  }
  .dk-tot { font-size: 13px; color: var(--dim) }
  .dk-tot b { font-size: 26px; color: var(--fg) }
  .cnts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
  .cn { padding: 8px 4px; border: 1px solid var(--line); border-radius: 12px; text-align: center }
  .cn b { display: block; font-size: 20px }
  .cn span { display: block; font-size: 11px }
  .cn small { font-size: 10px; color: var(--dim) }
  .cn.ok { border-color: #4ade8066; background: rgba(74,222,128,.08) }
  .cn.ok b { color: #4ade80 }
  .cn.warn { border-color: #fbbf2466; background: rgba(251,191,36,.08) }
  .cn.warn b { color: #fbbf24 }
  .iss { margin: 0; padding-left: 18px; font-size: 12px; color: #fbbf24 }

<script>
const DEX = window.DEX || { collections: {}, tcg: {}, fetched: null };
const LABELS = { gen1: "Gen 1", anniv: "30th Celebration" };
const COLLECTIONS = Object.fromEntries(Object.keys(LABELS).map(k =>
  [k, DEX.collections[k] || { name: LABELS[k], items: [], kind: "species" }]));
const kindOf = k => COLLECTIONS[k].kind || "species";

const ART = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
const CARD_IMG = id => `https://images.pokemontcg.io/${id.slice(0, id.lastIndexOf("-"))}/${id.slice(id.lastIndexOf("-") + 1)}.png`;
const FORM = /^(Mega|Gigantamax|Alolan|Galarian|Hisuian|Paldean)\b/;
const SPECIES = n => n.replace(FORM, "").replace(/\s+[XY]$/, "").trim();

// ponytail: localStorage throws on opaque origins (data:, sandboxes) -> fall back to in-memory
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem("pkdx:" + k)) ?? d } catch { return d } },
  set: (k, v) => { try { localStorage.setItem("pkdx:" + k, JSON.stringify(v)) } catch {} },
};
const have  = new Set(store.get("have", []));    // real TCG cards owned, keyed card id
const favs  = store.get("favs", {});             // "collection:index" -> {id, img}
const seen  = store.get("seen", {});             // this device only: species -> {total, have}, badge fallback
const decks = store.get("decks", []);            // [{name, notes, cover, cards: [{id, n, name, cat}]}]
Object.keys(favs).forEach(k => k.split(":")[0] in COLLECTIONS || delete favs[k]);   // Gen 2/3 leftovers
const save = (sync = true) => {
  store.set("have", [...have]); store.set("favs", favs); store.set("seen", seen); store.set("decks", decks);
  if (sync && typeof push === "function") push();
};

// view settings from the ☰ menu; per device on purpose (phone and laptop want different grids)
const prefs = {};
document.querySelectorAll(".seg").forEach(s => {
  const v = store.get(s.dataset.pref);
  prefs[s.dataset.pref] = [...s.children].some(b => b.dataset.v === v) ? v : s.dataset.def;
});
function applyPrefs() {
  list.style.setProperty("--cols", prefs.cols);
  document.querySelectorAll(".seg button").forEach(b =>
    b.classList.toggle("on", prefs[b.parentElement.dataset.pref] === b.dataset.v));
}

const HASH = location.hash.slice(1);
let cur = ["all", "decks", "data"].includes(HASH) || HASH in COLLECTIONS ? HASH : "gen1";
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const count = k => kindOf(k) === "cards"
  ? COLLECTIONS[k].items.filter(p => have.has(p.id)).length
  : COLLECTIONS[k].items.filter(p => hasCard(k, p)).length;
const cardsOf = sp => DEX.tcg[sp] || null;
// a Pokémon tile counts as owned once any of its real cards is
const hasCard = (k, p) => {
  const local = cardsFor(p);
  return local ? local.some(c => have.has(c.id)) : (seen[k + ":" + p.i]?.have || 0) > 0;
};

// TCG names its forms differently than the proxy list does: Mega -> "M X-EX" / "Mega X ex",
// Gigantamax -> "X VMAX", regionals keep their word.
const IS_MEGA = c => /\bmega\b/i.test(c.name) || /^m[\s-]/i.test(c.name);
const IS_VMAX = c => /\bvmax\b/i.test(c.name);
const REGIONS = ["Alolan", "Galarian", "Hisuian", "Paldean"];
const word = w => new RegExp(`\\b${w}\\b`, "i");

function filterForms(all, p) {
  if (!all) return null;
  const form = (p.name.match(FORM) || [])[0];
  if (!form) return all.filter(c => !IS_MEGA(c) && !IS_VMAX(c) && !REGIONS.some(r => word(r).test(c.name)));
  if (form === "Gigantamax") return all.filter(IS_VMAX);
  if (form !== "Mega") return all.filter(c => word(form).test(c.name));
  const letter = (p.name.match(/\s([XY])$/) || [])[1];      // Mega Charizard X vs Y
  const other = letter === "X" ? "Y" : "X";
  return all.filter(c => IS_MEGA(c) && (!letter || !word(other).test(c.name)));
}
const cardsFor = p => filterForms(cardsOf(p.sp || SPECIES(p.name)), p);

const bar = k => {
  const a = count(k), b = COLLECTIONS[k].items.length;
  return `<div class="stat">
    <div class="t"><span>${COLLECTIONS[k].name}</span><span>${pct(a, b)}%</span></div>
    <div class="v">${a} <span style="color:var(--dim);font-size:14px">/ ${b}</span></div>
    <div class="bar"><i style="width:${pct(a, b)}%"></i></div>
  </div>`;
};

function stats() {
  const keys = Object.keys(COLLECTIONS);
  const all = cur === "all";
  // One ring for whatever is on screen: the open collection, or the lot on the All tab.
  const scope = all ? keys : [cur];
  const h = scope.reduce((s, k) => s + count(k), 0);
  const t = scope.reduce((s, k) => s + COLLECTIONS[k].items.length, 0);

  banner.innerHTML = `
    <div class="hero">
      <div class="ring" style="--p:${pct(h, t)}"><span>${pct(h, t)}%</span></div>
      <div>
        <h1>${all ? "All collections" : COLLECTIONS[cur].name}</h1>
        <div class="big">${h} <span style="color:var(--dim)">/ ${t}</span></div>
        <div class="sub">${have.size} TCG cards owned · ${Object.keys(favs).length} favourites picked</div>
        ${!all && prefs.show !== "all"
          ? `<div class="sub filt">Showing ${prefs.show} only · ${prefs.show === "owned" ? h : t - h}</div>` : ""}
      </div>
    </div>
    ${all ? `<div class="stats">${keys.map(bar).join("")}</div>` : ""}`;
}

function render() {
  document.querySelectorAll("nav .pill").forEach(b => b.classList.toggle("on", b.dataset.c === cur));
  document.body.classList.toggle("overview", cur === "all");
  document.body.classList.toggle("decking", cur === "decks");
  document.body.classList.toggle("datapage", cur === "data");
  if (cur === "decks") return renderDecks();
  if (cur === "data") { renderData(); if (!runs) loadRuns(); return }
  stats();

  if (cur === "all") { list.innerHTML = ""; foot.textContent = ""; return }

  const kind = kindOf(cur);
  list.classList.toggle("cardsgrid", kind === "cards");
  const items = COLLECTIONS[cur].items;
  const has = kind === "cards" ? p => have.has(p.id) : p => hasCard(cur, p);
  const shown = p => prefs.show === "all" || has(p) === (prefs.show === "owned");

  if (kind === "cards") {
    list.innerHTML = items.length ? items.map((p, n) => !shown(p) ? "" : `
      <article class="tcg ${have.has(p.id) ? "have" : ""}" data-cid="${p.id}" data-n="${n}">
        <span class="idx">#${String(p.i + 1).padStart(3, "0")}</span>
        <img loading="lazy" alt="${p.name}" src="${p.img || CARD_IMG(p.id)}">
        <div class="n">${p.name}</div>
        <div class="s">${p.set} · ${p.number}/${p.total ?? "?"}${p.rarity ? " · " + p.rarity : ""}</div>
        <div class="p">${p.price[1]}<small>${p.price[2]}</small></div>
        <div class="own">${have.has(p.id) ? "✓ I own this" : "＋ tap to mark owned"}</div>
      </article>`).join("") : `<p class="empty">No cards cached yet — run python3 fetch_data.py.</p>`;
  } else {
    list.innerHTML = items.length ? items.map((p, n) => {
      if (!shown(p)) return "";
      const id = cur + ":" + p.i, form = (p.name.match(FORM) || [])[0];
      const local = cardsFor(p), s = seen[id], fav = favs[id];
      const badge = local ? `${local.filter(c => have.has(c.id)).length}/${local.length}`
                          : s ? `${s.have}/${s.total}` : "?/?";
      return `<article class="card ${has(p) ? "done" : ""}" data-id="${id}" data-n="${n}">
        <span class="idx">#${String(p.i).padStart(3, "0")}</span>
        <span class="tick" title="you own a card of this">✓</span>
        <img loading="lazy" alt="${p.name}" src="${ART(p.id)}"
             onerror="this.onerror=null;this.src='${ART(Number(p.dex))}'">
        <div class="dex">${p.dex}</div>
        <div class="row">
          <span class="cnt" title="TCG cards you own / total prints">${badge}</span>
          <span class="name">${p.name}</span>
          ${fav ? `<img class="mini" alt="favourite print" src="${fav.img}">` : ""}
        </div>
        <button class="pill sm cards" data-act="cards">View cards</button>
        ${form ? `<span class="form">${form}</span>` : ""}
      </article>`;
    }).join("") : `<p class="empty">Nothing here yet — add pokedex${cur.replace("gen", "Gen")}.txt and re-run fetch_data.py.</p>`;
  }
  if (!list.innerHTML) list.innerHTML = `<p class="empty">${prefs.show === "owned"
    ? "Nothing marked owned in this collection yet." : "Nothing missing — this collection is complete. 🎉"}</p>`;

  const n = Object.values(DEX.tcg).reduce((s, v) => s + v.length, 0);
  foot.textContent = DEX.fetched
    ? `${n.toLocaleString()} TCG cards cached locally (data.js, fetched ${DEX.fetched}) · re-run python3 fetch_data.py --refresh to update prices`
    : "No data.js yet — run python3 fetch_data.py to cache every card locally (the page falls back to the live API meanwhile).";
}

// ---- TCG variations popup ----
const tcgCache = new Map();
let view = { cards: [], entry: null, key: "date", dir: -1 };

// ponytail: rarity names are unbounded, first keyword match wins
const TIERS = [[/secret|hyper|gold/i, 9], [/special illustration/i, 8], [/illustration/i, 7],
               [/ultra|gx|vmax|vstar|\bex\b/i, 6], [/double/i, 5], [/holo/i, 4],
               [/^rare/i, 3], [/uncommon/i, 2], [/common/i, 1]];
const rarityRank = c => (TIERS.find(([re]) => re.test(c.rarity || "")) || [0, 0])[1];
const SORTS = { date: c => c.date || "", price: c => c.price[0] ?? -1, rarity: c => rarityRank(c) };

function livePrice(c) {  // only used by the API fallback below
  const tp = c.tcgplayer?.prices || {};
  for (const k in tp) {
    const v = tp[k].market ?? tp[k].mid;
    if (v) return [v, `$${v.toFixed(2)}`, k.replace(/([a-z])([A-Z])/g, "$1 $2")];
  }
  const cm = c.cardmarket?.prices || {};
  const v = cm.trendPrice ?? cm.averageSellPrice;
  return v ? [v, `€${v.toFixed(2)}`, "cardmarket trend"] : [null, "—", "no price"];
}

async function variations(species, filter) {
  const local = cardsFor(filter);
  if (local) return local;                       // data.js: instant, offline
  if (!tcgCache.has(species)) {                  // fallback while data.js is missing
    // quoted wildcards make the API 500, and it randomly 502s -> unquoted token + retries
    const token = species.split(/[^A-Za-z0-9]+/).sort((a, b) => b.length - a.length)[0];
    const url = `https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent("name:*" + token + "*")}` +
                `&pageSize=250&select=id,name,number,rarity,set,tcgplayer,cardmarket`;
    let data, err;
    for (let i = 0; i < 4 && !data; i++) {
      if (i) await new Promise(r => setTimeout(r, 400 * i));
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`API ${r.status}`);
        data = ((await r.json()).data || []).map(c => ({
          id: c.id, name: c.name, number: c.number, total: c.set.printedTotal,
          set: c.set.name, series: c.set.series, date: c.set.releaseDate,
          rarity: c.rarity || "", price: livePrice(c),
        }));
      } catch (e) { err = e }
    }
    if (!data) throw err;
    tcgCache.set(species, data);
  }
  return filterForms(tcgCache.get(species), filter);
}

function renderStrip(keepScroll) {
  const { cards, entry, key, dir } = view;
  const fav = favs[entry.id];
  const at = keepScroll ? (window.strip?.scrollLeft ?? 0) : 0;
  const sorted = [...cards].sort((a, b) => {
    const x = SORTS[key](a), y = SORTS[key](b);
    return (x < y ? -1 : x > y ? 1 : a.name.localeCompare(b.name)) * dir;
  });

  document.querySelectorAll(".m-tools .pill").forEach(b => b.classList.toggle("on", b.dataset.s === key));
  document.getElementById("m-sub").textContent =
    `${cards.filter(c => have.has(c.id)).length}/${cards.length} cards owned · ` +
    `sorted by ${key} ${dir < 0 ? "▼" : "▲"} (click the pill again to flip)`;

  document.getElementById("m-content").innerHTML = sorted.length
    ? `<div class="strip" id="strip">${sorted.map(c => `
        <div class="tcg ${have.has(c.id) ? "have" : ""} ${fav?.id === c.id ? "fav" : ""}" data-cid="${c.id}">
          <img loading="lazy" alt="${c.name}" src="${CARD_IMG(c.id)}">
          <div class="n">${c.name}</div>
          <div class="s">${c.set} · ${c.number}/${c.total ?? "?"}${c.rarity ? " · " + c.rarity : ""}</div>
          <div class="s">${c.series} · ${(c.date || "").slice(0, 4)}</div>
          <div class="p">${c.price[1]}<small>${c.price[2]}</small></div>
          <button class="star" data-act="fav" title="favourite print">★</button>
          <div class="own">${have.has(c.id) ? "✓ I own this" : "＋ tap to mark owned"}</div>
        </div>`).join("")}</div>`
    : `<p class="msg">No TCG cards found.</p>`;

  if (at) strip.scrollLeft = at;
  else document.querySelector(".tcg.fav")?.scrollIntoView({ inline: "center", block: "nearest" });
}

async function openCard(p) {
  const sp = p.sp || SPECIES(p.name);
  view = { cards: [], entry: { id: cur + ":" + p.i, species: sp }, key: view.key, dir: view.dir };
  document.getElementById("m-art").src = ART(p.id);
  document.getElementById("m-name").textContent = p.name;
  document.getElementById("m-sub").textContent = `Loading TCG variations of ${sp}…`;
  document.getElementById("m-content").innerHTML = `<p class="msg">Fetching cards…</p>`;
  modal.hidden = false;
  try {
    view.cards = await variations(sp, p);
    seen[view.entry.id] = { total: view.cards.length, have: view.cards.filter(c => have.has(c.id)).length };
    save();
    renderStrip();
    render();
  } catch (e) {
    document.getElementById("m-sub").textContent = "";
    document.getElementById("m-content").innerHTML =
      `<p class="msg">Could not load cards (${e.message}). Run fetch_data.py for offline data, or try again.</p>`;
  }
}

const head = document.querySelector("header");
const burger = document.getElementById("burger");
const closeMenu = () => { document.body.classList.remove("menu"); burger.setAttribute("aria-expanded", "false") };
burger.onclick = e => {
  e.stopPropagation();
  const open = !document.body.classList.toggle("menu");
  burger.setAttribute("aria-expanded", String(!open));
};

// the grid reflows under a setting change; keep the card at the top of the screen at the top
function stayPut(change) {
  const a = [...list.children].find(c => c.getBoundingClientRect().bottom > head.offsetHeight);
  const n = +a?.dataset.n, y = Math.max(a?.getBoundingClientRect().top, head.offsetHeight);
  change();
  const b = [...list.children].find(c => +c.dataset.n >= n);
  if (b && scrollY) scrollBy(0, b.getBoundingClientRect().top - y);
}

document.querySelector(".tools").addEventListener("click", e => {
  if (e.target.closest(".pill")) return closeMenu();     // tools close it; settings keep it open to compare
  const b = e.target.closest(".seg button"), k = b?.parentElement.dataset.pref;
  if (!b || prefs[k] === b.dataset.v) return;
  stayPut(() => {
    prefs[k] = b.dataset.v; store.set(k, prefs[k]); applyPrefs();
    if (k === "show") render();
  });
});
addEventListener("click", e => { if (!e.target.closest("header")) closeMenu() });

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest(".pill");
  if (!b) return;
  cur = b.dataset.c; location.hash = cur; openDeck(null); render(); scrollTo({ top: 0, behavior: "smooth" });
});

list.addEventListener("click", e => {
  const g = e.target.closest(".tcg");
  if (g) {                                   // master-set tab: tapping a card marks it owned
    have.has(g.dataset.cid) ? have.delete(g.dataset.cid) : have.add(g.dataset.cid);
    g.classList.toggle("have", have.has(g.dataset.cid));
    g.querySelector(".own").textContent = have.has(g.dataset.cid) ? "✓ I own this" : "＋ tap to mark owned";
    save(); stats();
    return;
  }
  // a Pokémon tile opens its prints; it turns owned by itself once one of them is
  const c = e.target.closest(".card");
  if (c) openCard(COLLECTIONS[cur].items[+c.dataset.n]);
});

document.querySelector(".m-tools").addEventListener("click", e => {
  const b = e.target.closest(".pill");
  if (!b || !view.cards.length) return;
  view.dir = b.dataset.s === view.key ? -view.dir : -1;   // a new key starts high-to-low
  view.key = b.dataset.s;
  renderStrip();
});

document.getElementById("m-content").addEventListener("click", e => {
  const t = e.target.closest(".tcg");
  if (!t) return;
  const card = view.cards.find(c => c.id === t.dataset.cid);
  if (!e.target.closest('[data-act="fav"]')) {          // tapping the tile tags it owned
    have.has(card.id) ? have.delete(card.id) : have.add(card.id);
    seen[view.entry.id].have = view.cards.filter(c => have.has(c.id)).length;
  } else if (favs[view.entry.id]?.id === card.id) {
    delete favs[view.entry.id];
  } else {
    favs[view.entry.id] = { id: card.id, img: CARD_IMG(card.id) };
  }
  save(); renderStrip(true); render();
});

// ---- wheel: eased glide; a gentle nudge moves a little, a fast spin or flick covers ground ----
// Touch screens keep their native momentum (and get the drag thumb below instead).
if (matchMedia("(pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let target = 0, y = 0, then = 0, last = 0, rate = 0, raf = 0;
  const glide = now => {
    if (Math.abs(scrollY - y) > 2) return raf = 0;          // scrollbar, keys or a jump took over
    target = Math.min(Math.max(target, 0), document.documentElement.scrollHeight - innerHeight);
    y += (target - y) * (1 - Math.exp(-Math.min(Math.max(now - then, 1), 50) / 90));  // ~90ms ease-out
    then = now;
    if (Math.abs(target - y) < .5) y = target;
    scrollTo(0, y);
    raf = y === target ? 0 : requestAnimationFrame(glide);
  };
  addEventListener("wheel", e => {
    if (e.ctrlKey || e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;   // zoom, sideways
    if (e.target.closest("#modal, #login, .tools") || !list.offsetHeight) return;
    e.preventDefault();
    const d = e.deltaY * [1, 40, innerHeight][e.deltaMode], now = performance.now();
    // how hard the wheel is going: |delta| summed, fading over ~160ms. Up to ~200px of it is
    // a careful scroll and moves 1:1; past that the step ramps up to 4x.
    rate = rate * Math.exp(-(now - last) / 160) + Math.abs(d);
    last = now;
    if (!raf) { target = y = scrollY; then = now; raf = requestAnimationFrame(glide) }
    target += d * (1 + Math.min(3, Math.max(0, rate - 200) / 250));
  }, { passive: false });
}

// ---- touch: grab the thumb on the right edge to race through a long grid ----
if (matchMedia("(pointer: coarse)").matches) {
  const tip = scrub.firstElementChild;
  let grab = null, fade;
  const range = () => [head.offsetHeight + 8, innerHeight - head.offsetHeight - scrub.offsetHeight - 24];
  const room = () => document.documentElement.scrollHeight - innerHeight;
  const label = () => {
    const c = document.elementFromPoint(innerWidth / 2, innerHeight / 2)?.closest(".card, .tcg");
    const t = s => c.querySelector(s)?.textContent || "";
    if (c) tip.textContent = c.matches(".card") ? `#${t(".dex")} ${t(".name")}` : `${t(".idx")} ${t(".n")}`;
  };
  const hideSoon = () => { clearTimeout(fade); fade = setTimeout(() => grab ?? scrub.classList.remove("on"), 1400) };
  addEventListener("scroll", () => {
    if (!list.offsetHeight || room() < innerHeight * 2) return scrub.classList.remove("on");
    const [top, h] = range();
    scrub.style.transform = `translateY(${top + h * Math.min(1, scrollY / room())}px)`;
    scrub.classList.add("on");
    if (grab !== null) label();
    hideSoon();
  }, { passive: true });
  scrub.addEventListener("pointerdown", e => {
    grab = e.clientY - scrub.getBoundingClientRect().top;
    scrub.setPointerCapture(e.pointerId); scrub.classList.add("drag"); label();
  });
  scrub.addEventListener("pointermove", e => {
    if (grab === null) return;
    const [top, h] = range();
    scrollTo(0, Math.min(1, Math.max(0, (e.clientY - grab - top) / h)) * room());
  });
  const drop = () => { grab = null; scrub.classList.remove("drag"); hideSoon() };
  scrub.addEventListener("pointerup", drop);
  scrub.addEventListener("pointercancel", drop);
}

// ---- deck analysis engine: pure functions over a deck's cards ("expanded": one entry per card, with
// its count). Defined once and run in two places: here for the cheap parts, and inside a Worker for
// the thousands of simulated games, so the page never stalls. ----
function Engine(E) {
  const num = s => +((String(s ?? "").match(/\d+/) || [0])[0]);
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const TL = E.TL = { Grass: "G", Fire: "R", Water: "W", Lightning: "L", Psychic: "P", Fighting: "F",
                      Darkness: "D", Metal: "M", Dragon: "N", Fairy: "Y", Colorless: "C" };
  E.stage = c => c.sub.includes("Stage 2") ? 2 : c.sub.includes("Stage 1") ? 1 : 0;
  E.prize = c => c.sub.includes("MEGA") ? 3 : c.sub.includes("ex") ? 2 : 1;
  E.basicEnergy = c => c.c === "E" && c.sub.includes("Basic");
  // the type an Energy card gives: basic by its name, a special one only when its name says so
  E.etype = c => E.basicEnergy(c) ? TL[(c.n.match(/(\w+) Energy/) || [])[1]] || "C"
    : TL[(c.n.match(/\b(Grass|Fire|Water|Lightning|Psychic|Fighting|Darkness|Metal)\b/) || [])[1]] || "*";
  E.hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0 };
  E.rng = seed => () => {                                  // mulberry32: same deck, same numbers
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  // what a card does, read from its text: draw, search, Rare Candy, Energy acceleration, gust…
  const KIND = [[/Basic Pokémon/i, "basic"], [/Stage 2/i, "stage2"], [/Stage 1/i, "stage1"], [/Evolution/i, "evo"],
    [/Pokémon Tool/i, "tool"], [/Pokémon/i, "poke"], [/Energy/i, "energy"], [/Supporter/i, "supporter"],
    [/Item/i, "item"], [/Stadium/i, "stadium"], [/Trainer/i, "trainer"]];
  E.fx = c => {
    if (c.fx) return c.fx;
    const f = { draw: 0, drawTo: 0, peek: 0, search: [], candy: 0, accel: 0, accelType: "", accelFrom: "",
                gust: 0, sw: 0, recover: 0, discard: 0, shuffle: 0, engine: false, onPlay: null, needs: "" };
    // a partner it can't work without (Lunatone needs Solrock in play, Solrock needs Lunatone on the Bench)
    for (const t of [...(c.ab || []).map(a => a[1]), ...(c.atk || []).map(a => a[3])]) {
      const m = (t || "").match(/if you (?:don't |do not )?have ([A-Z][\w'’.-]*(?: [A-Z][\w'’.-]*)*) (?:in play|on your Bench)/);
      if (m && m[1] !== c.n && !/^(any|no)\b/i.test(m[1])) { f.needs = m[1]; break }
    }
    for (const raw of c.c === "P" ? (c.ab || []).map(a => a[1]) : [c.rt || ""]) {
      const t = raw.replace(/\s+/g, " ");

        f.onPlay = { draw: d ? +d[1] : 0, search: s ? [{ kind: (KIND.find(([re]) => re.test(s[1])) || [, "any"])[1], n: 1, bench: false, hp: 999 }] : [] };
        continue;

          || /were Knocked Out during your opponent's last turn/i.test(t))) continue;
      if ((m = t.match(/draw cards until you have (\d+) cards/i))) f.drawTo = +m[1];
      else if ((m = t.match(/draw (\d+) cards instead/i))) f.draw = +m[1];          // the early-game bonus

  // the realistic peak of an attack on a normal mid-game board: "30×" and "120+" get estimated

  E.best = (c, copy = 0) => (c.atk || []).map(a => E.hit(a, copy)).reduce((b, h) => h.v + h.spread / 2 > b.v + b.spread / 2 ? h : b,

  // Pokémon grouped into lines by their Basic; each line plays as Attacker (A), Engine (E) or Support (S)
  E.roles = (cards, overrides = {}) => {

    const copy = Math.max(0, ...pok.map(c => E.best(c).v));          // what a copying attack can borrow

    const types = new Set(cards.filter(c => c.c === "E" && !c.dead).map(E.etype));

  // Goldfish games (no opponent): how soon is the ideal board ready — the main Attacker evolved and
  // powered, every Engine in play — and how many extra cards the deck digs per turn
  E.simulate = (cards, overrides, games, seed) => {
    const fs = E.roles(cards, overrides), rnd = E.rng(seed);
    const atkF = fs.filter(f => f.role === "A").sort((a, b) => b.weight - a.weight)[0];   // the main attacker
    const atk = atkF && atkF.atk, cost = atk ? atkF.hit.cost : "", need = {};
    const live = cards.map(c => ({ c, fx: E.fx(c), st: c.c === "P" ? E.stage(c) : -1,
      basic: c.c === "P" && !c.dead && E.stage(c) === 0, et: c.c === "E" && !c.dead ? E.etype(c) : "" }));
    // a type the deck has no way to produce is paid some way the text didn't reveal: count it as any
    const makes = new Set([...live.map(x => x.et), ...live.map(x => x.fx.accelType)].filter(Boolean));
    for (const ch of cost) { const L = ch === "C" || makes.has(ch) ? ch : "C"; need[L] = (need[L] || 0) + 1 }
    const idx = {}; cards.forEach((c, i) => { if (idx[c.n] == null) idx[c.n] = i });
    const candy = cards.findIndex(c => E.fx(c).candy);
    const goals = [atk, ...fs.filter(f => f.role === "E").map(f => f.eng)].filter(Boolean).map(T => {
      const chain = [T.n];
      for (let x = T; x.ef && idx[x.ef] != null && chain.length < 3;) { x = cards[idx[x.ef]]; chain.unshift(x.n) }
      if (E.stage(cards[idx[chain[0]]]) > 0 && idx[T.root] != null) chain.unshift(T.root);

    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]] } return a };
    const R = { hist: Array(10).fill(0), mull: 0, access: 0, seen: cards.map(() => [0, 0, 0, 0]) };

      const charge = () => atk && play.filter(p => cards[p.i].root === atk.root).sort((a, b) => live[b.i].st - live[a.i].st)[0];

          case "evo": return x.st > 0;
          case "stage1": return x.st === 1;
          case "stage2": return x.st === 2;
          case "energy": return c.c === "E";
          case "item": return c.sub.includes("Item");
          case "tool": return c.sub.includes("Pokémon Tool");
          case "supporter": return c.sub.includes("Supporter");

      };

          if (play.length >= 6) break;

        }

      };

          else if (f.accelFrom === "deck") { const j = deck.findIndex(ok); if (j < 0) break; p.en.push(live[deck.splice(j, 1)[0]].et) }

          if (f.drawTo && hand.length < f.drawTo) { got += draw(f.drawTo - hand.length); did = true }
          else if (f.draw) { got += draw(f.draw); did = true }

          if (did) { p.used = t; any = true }

      };
      const items = () => {
        let any = false;
        for (const i of [...new Set(hand)]) {
          const x = live[i], f = x.fx;

      };
      const evolve = () => {
        if (t < 2) return false;                         // nobody evolves on their first turn
        let any = false;
        for (const i of hand.slice()) {
          const c = cards[i];

          const p = play.find(p => cards[p.i].n === c.ef && p.t < t && p.evo < t);

        if (candy >= 0 && hand.includes(candy))

      };

        for (const s of f.search) got += tutor(s);

      };

        const p = charge(); if (!p) return;
        const s = short(p); if (!s.miss.length && s.left <= 0) return;

      };

        const p = play.find(p => cards[p.i].n === atk.n);

        const s = short(p);
        return !s.miss.length && s.left <= 0;

      hand.forEach(see); bench();

        got = 0; draw(1);

        if (isReady()) { ready = t; break }

      R.hist[ready]++; R.access += access;
      seen.forEach((s, i) => { for (let k = 0; k < 4; k++) if (s <= k) R.seen[i][k]++ });
    }

    const by = k => R.hist.slice(0, k + 1).reduce((a, b) => a + b, 0) / games;
    const a = atk && atkF.hit, pub = T => ({ name: T.n, hp: T.hp || 0, prize: E.prize(T), wk: T.wk || "", rs: T.rs || "" });
    return {
      games, hist: R.hist, pSetup4: by(4), avgSetup: R.hist.reduce((s, n, k) => s + n * Math.min(k, 8), 0) / games,
      mull: R.mull / games, access: R.access / games / 3,
      seen: Object.fromEntries(cards.map((c, i) => [c.k ?? c.n, R.seen[i].map(v => v / games)])),
      attacker: atk ? { ...pub(atk), v: a.v, spread: a.spread, cost, type: TL[atk.t[0]] || "C" } : null,
      engines: goals.filter(G => G.T !== atk).map(G => pub(G.T)),

  };

  // 0–100 per factor; the total weighs a deck the way competitive players do
  E.score = (p, hps) => {
    const a = p.attacker, val = a ? a.v + a.spread / 2 : 0;
    const s = { C: clamp(100 * (0.85 * p.pSetup4 + 0.15 * (1 - p.mull))),

  // a prize race: when each side is ready, then how many attacks it takes to collect 6 Prizes
  const dmgTo = (a, t) => Math.max(10, a.v * (t.wk && t.wk.includes(a.type) ? 2 : 1) - (t.rs && t.rs.includes(a.type) ? 30 : 0));
  const kos = (A, B) => {
    const a = A.attacker; if (!a) return 30;

    const reach = A.gust > 0 || a.spread > 0;              // Benched engines only fall to gust or spread
    const left = [...Array(4).fill(foe), ...(reach ? B.engines.map(e => ({ ...e, hp: Math.max(10, e.hp - a.spread) })) : []),

      .forEach(([name, share, avg, mode]) => tip(`Most ${A} lists (${share}%) run ${mode ?? avg} ${name}; you run ${mine[name] || 0}.`, "M"));
    U.filter(([name, share, , , top]) => top - share >= 15 && !mine[name]).slice(0, 3)
      .forEach(([name, share, , mode, top]) => tip(`Top-placing ${A} lists favour ${name}: ${top}% of them run it vs ${share}% overall.`, "M"));
    const techs = U.filter(([name, share]) => share >= 20 && share < 60 && !mine[name]).slice(0, 5);
    if (techs.length) tip(`Tech options other ${A} players use: ${techs.map(([n, sh]) => `${n} (${sh}%)`).join(", ")}.`, "M");
    cards.filter(c => !c.dead && !(U.find(u => u[0] === c.n)?.[1] >= 10)).slice(0, 3)
      .forEach(c => tip(`${c.n} is in under 10% of ${A} lists — is it pulling its weight?`, "M"));
  }
  return T;
}

// partner pairs a deck runs, read from the cards' own text: [card, the partner it needs]
function pairsOf(cards) {
  return cards.filter(c => ENG.fx(c).needs && cards.some(x => x.n === ENG.fx(c).needs)).map(c => [c.n, ENG.fx(c).needs]);
}

// Trainers by how much of the meta plays them (each archetype weighted by its share)
const META_SHARE = META.decks.reduce((s, m) => s + m.share, 0) || 1;
const POPULAR = (() => {
  const w = new Map();
  META.decks.forEach(m => m.usage.forEach(([name, share]) => {
    if (NAMED.get(name)?.c === "T") w.set(name, (w.get(name) || 0) + m.share * share / 100);
  }));
  return new Map([...w].sort((a, b) => b[1] - a[1]).map(([name, v]) => [name, Math.round(100 * v / META_SHARE)]));
})();
const tagsOf = (c, type) => {
  const f = ENG.fx(c), t = [];
  if (f.draw || f.drawTo) t.push("Draw");
  if (f.search.length) t.push("Search");
  if (f.gust) t.push("Gust");
  if (f.sw) t.push("Switch");
  if (f.recover) t.push("Recovery");
  if (f.candy) t.push("Rare Candy");
  if (f.accel) t.push("Energy");
  if (type && new RegExp(`\\b${type}\\b`).test(c.rt || "")) t.push(`${type} support`);
  t.push(c.sub.includes("ACE SPEC") ? "ACE SPEC" : c.sub.includes("Stadium") ? "Stadium" : c.sub.includes("Pokémon Tool") ? "Tool" : c.sub.includes("Supporter") ? "Supporter" : "Item");
  return t;
};
// Trainers that would add flow: popular across the meta, made for the attacker's type, or filling a gap
function usefulTrainers(d, cards) {
  const fs = ENG.roles(cards, d.roles), main = fs.filter(f => f.role === "A").sort((a, b) => b.weight - a.weight)[0];
  const type = main?.atk?.t?.[0], fx = c => ENG.fx(c);
  const has = name => cards.filter(c => c.n === name).reduce((s, c) => s + c.count, 0);
  const n = pred => cards.reduce((s, c) => s + (pred(c) ? c.count : 0), 0), ace = n(c => c.sub.includes("ACE SPEC"));
  const gaps = { Draw: n(c => c.sub.includes("Supporter") && (fx(c).draw || fx(c).drawTo)) < 6,
                 Search: n(c => c.c === "T" && fx(c).search.length) < 6, Gust: !n(c => fx(c).gust),
                 Switch: !n(c => fx(c).sw), Recovery: !n(c => fx(c).recover), "ACE SPEC": !ace };
  const pool = new Map();
  [...POPULAR.keys()].slice(0, 40).forEach(name => pool.set(name, NAMED.get(name)));
  if (type) CARDS.cards.filter(c => c.c === "T" && new RegExp(`\\b${type}\\b`).test(c.rt || "")).forEach(c => pool.set(c.n, c));
  return [...pool.values()].filter(c => c && has(c.n) < 2 && !(ace && c.sub.includes("ACE SPEC")))
    .map(c => {
      const tags = tagsOf(c, type), fills = tags.filter(t => gaps[t]);
      return { c, tags, fills, pop: POPULAR.get(c.n) || 0,
               score: (POPULAR.get(c.n) || 0) + fills.length * 25 + (tags.includes(`${type} support`) ? 20 : 0) };
    }).sort((a, b) => b.score - a.score).slice(0, 8);
}

// what to try swapping: what winning lists run, common staples, a thicker main line; out goes
// whatever does least (no draw, search, gust, recovery — Support Pokémon before Engines)
function swapCandidates(d, cards) {
  const has = name => cards.filter(c => c.n === name).reduce((s, c) => s + c.count, 0);
  const partner = Object.fromEntries(pairsOf(cards));
  // a pair stays balanced: only its scarcer half is ever added, only an extra copy of the bigger half removed
  const evenUp = c => !partner[c.n] || has(c.n) < has(partner[c.n]);
  const ace = cards.some(c => c.sub.includes("ACE SPEC")), adds = new Map();
  const add = c => { if (c && !adds.has(c.k) && (ENG.basicEnergy(c) || has(c.n) < COPIES) && !(ace && c.sub.includes("ACE SPEC")) && evenUp(c)) adds.set(c.k, c) };
  const arch = archetype(cards), fs = ENG.roles(cards, d.roles);
  Object.keys(partner).forEach(name => add(NAMED.get(name)));
  if (arch) {
    arch.m.usage.filter(u => u[1] >= 50 && has(u[0]) < (u[3] ?? Math.round(u[2]))).slice(0, 4).forEach(u => add(NAMED.get(u[0])));
    arch.m.usage.filter(u => u[4] - u[1] >= 15 && !has(u[0])).slice(0, 2).forEach(u => add(NAMED.get(u[0])));
  }
  for (const f of fs.filter(f => f.role !== "S")) add(cards.find(c => c.root === f.root && ENG.stage(c) === 0 && !c.dead));
  usefulTrainers(d, cards).slice(0, 6).forEach(x => add(x.c));
  for (const name of STAPLES) if (adds.size < 12) add(NAMED.get(name));
  const roleOf = c => fs.find(f => f.root === c.root)?.role;
  const worth = c => { const f = ENG.fx(c);
    return c.dead ? -1 : c.c === "P" ? (roleOf(c) === "S" ? 1 : 9) : f.search.length || f.draw || f.drawTo || f.candy ? 6
      : f.gust || f.recover || f.sw ? 4 : c.c === "E" ? 3 : 2 };
  return { adds: [...adds.values()].slice(0, 12).map(expandCard),
           removes: cards.filter(c => !c.dead && !ENG.fx(c).gust && (!partner[c.n] || has(c.n) > has(partner[c.n])))
                         .sort((a, b) => worth(a) - worth(b)).slice(0, 5) };
}

// € of the chosen print (or of the card's other prints when that one has none); $ only for cards
// with no Cardmarket price at all; "cheapest" swaps every card for its cheapest € print
function deckPrice(d) {
  let eur = 0, usd = 0, cheap = 0, none = 0;
  for (const l of d.cards) {
    const hit = PRINT.get(l.id);
    if (!hit) { none += l.n; continue }
    const ps = hit[0].p.map(x => x[4]).filter(v => v != null), low = ps.length ? Math.min(...ps) : null;
    if (hit[1][4] != null || low != null) { eur += (hit[1][4] ?? low) * l.n; cheap += low * l.n }
    else if (hit[1][5] != null) usd += hit[1][5] * l.n;
    else none += l.n;
  }
  return { eur, usd, cheap, none };
}
const money = (v, sym = "€") => `${sym}${v.toFixed(2)}`;
const linePrice = l => { const p = PRINT.get(l.id)?.[1]; return !p ? "" : p[4] != null ? money(p[4] * l.n) : p[5] != null ? money(p[5] * l.n, "$") : "" };

// ---- versions: one snapshot per editing session, plus 📌 with a label; the last 20 are kept ----
const compact = d => d.cards.map(l => `${l.id}:${l.n}`).sort().join(",");
const uncompact = s => (s ? s.split(",") : []).map(x => {
  const [id, n] = x.split(":"), c = PRINT.get(id)?.[0];
  return { id, n: +n || 1, name: c ? c.n : id, cat: c ? CAT[c.c] : "Trainer" };
});
function snapshot(d, label = "") {
  const list = compact(d);
  if (!label && d.versions[0]?.list === list) return;
  d.versions.unshift({ t: Date.now(), label, list });
  d.versions.length = Math.min(d.versions.length, 20);
  save();
}
function openDeck(d) {
  if (open && open !== d && compact(open) !== openedAs) {        // leaving a deck that changed: end of session
    if (!open.versions.length && openedAs) open.versions.unshift({ t: Date.now() - 1, label: "before", list: openedAs });
    snapshot(open);
  }
  open = d; pane = "cards"; dlg.hidden = true; hand = null;
  openedAs = d ? compact(d) : "";
}
addEventListener("visibilitychange", () => { if (document.hidden && open && compact(open) !== openedAs) { snapshot(open); openedAs = compact(open) } });

function matches(c) {
  if (pick.cat !== "all" && c.c !== pick.cat) return false;
  if (pick.q && !c.n.toLowerCase().includes(pick.q) && !(pick.q.length >= 3 && textOf(c).includes(pick.q))) return false;
  if ((pick.types.size || pick.stages.size || pick.ex) && c.c !== "P") return false;   // Pokémon-only filters
  if (pick.types.size && !c.t.some(t => pick.types.has(t))) return false;
  if (pick.stages.size && ![...pick.stages].some(s => c.sub.includes(s))) return false;
  if (pick.ex && !c.sub.includes("ex")) return false;
  if (pick.kinds.size && ![...pick.kinds].some(k => c.sub.includes(KINDS[k]))) return false;
  return true;
}

// ---- Insights: the scores and why, tips, tested swaps, matchups, Energy vs costs, versions ----
function renderInsights() {
  const d = open, cards = expand(d.cards), p = deckProfile(d), s = p?.score, el = deckview.querySelector(".ins");
  if (!d.cards.length) { el.innerHTML = `<p class="empty">Add cards to see how the deck plays.</p>`; return }
  const arch = archetype(cards), fs = ENG.roles(cards, d.roles);
  const why = p && {
    C: `Fully set up by turn 4 in ${perc(p.pSetup4)} of games · mulligan ${perc(p.mull)}`,
    P: p.attacker ? `${p.attacker.name}: ~${p.attacker.v} damage${p.attacker.spread ? ` + ${p.attacker.spread} to the Bench` : ""}, vs the meta's attackers (${Math.min(...HP)}–${Math.max(...HP)} HP)` : "No attacker found",
    D: `${p.access.toFixed(1)} extra cards drawn or searched per turn, turns 1–3`,
    G: `Ideal board on turn ${p.avgSetup.toFixed(1)} on average${p.hist[9] ? ` · never by turn 8 in ${perc(p.hist[9] / p.games)}` : ""}`,
  };
  const goals = fs.filter(f => f.role !== "S").map(f => `<span class="role r-${f.role}">${f.role}</span> ${esc(f.role === "E" ? f.eng?.n || f.root : f.atk?.n || f.root)}`).join(" · ");
  const tips = tipsOf(d, cards, p);
  const sw = p && SWAPS.get(p.key);
  if (p && !SWAPS.has(p.key)) {
    SWAPS.set(p.key, null);
    const { adds, removes } = swapCandidates(d, cards);
    run("swaps", cards, d.roles, adds, removes, HP, p.key).then(r => { SWAPS.set(p.key, Array.isArray(r) ? r : []); refresh() });
  }
  const mu = (label, share, other, seed, real) => {
    if (!p || !other) return `<div class="mu"><span class="mn">${label}</span><span class="sub">simulating…</span></div>`;

// ---- compare two lists: card by card, and their scores ----
async function compare(label, lines) {
  const a = expand(open.cards), b = expand(lines), names = {};
  open.cards.forEach(l => { names[l.name] = (names[l.name] || 0) + l.n });
  const theirs = {}; lines.forEach(l => { theirs[l.name] = (theirs[l.name] || 0) + l.n });
  const diff = [...new Set([...Object.keys(names), ...Object.keys(theirs)])]
    .map(n => [n, (names[n] || 0) - (theirs[n] || 0)]).filter(x => x[1]).sort((x, y) => y[1] - x[1]);
  zoomCard = null; dlg.hidden = false;
  dlgBox.innerHTML = `<div class="m-head"><div><h2>${esc(open.name)} vs ${esc(label)}</h2><div class="sub">Simulating both…</div></div>
    <button class="x" data-z="close">✕</button></div>`;
  const [pa, pb] = await Promise.all([profile(a, open.roles), profile(b, {})]);
  if (dlg.hidden) return;
  const row = (k, t) => `<tr><td>${t}</td><td>${pa?.score[k] ?? "…"}</td><td>${pb?.score[k] ?? "…"}</td>
    <td class="${(pa?.score[k] ?? 0) >= (pb?.score[k] ?? 0) ? "ok" : "bad"}">${pa && pb ? (pa.score[k] - pb.score[k] > 0 ? "+" : "") + (pa.score[k] - pb.score[k]) : ""}</td></tr>`;
  dlgBox.innerHTML = `<div class="m-head"><div><h2>${esc(open.name)} vs ${esc(label)}</h2>
      <div class="sub">+ means this deck has more</div></div><button class="x" data-z="close">✕</button></div>
    <div class="imp"><table class="cmp"><tr><th></th><th>This deck</th><th>${esc(label)}</th><th></th></tr>
      ${row("total", "Total")}${Object.entries(FACTOR).map(([k, t]) => row(k, t)).join("")}</table>
      <div class="diff">${diff.map(([n, v]) => `<div class="${v > 0 ? "ok" : "bad"}">${v > 0 ? "+" : ""}${v} ${esc(n)}</div>`).join("") || "<div>Same cards.</div>"}</div></div>`;
}

// ---- test hands: an opening 7 and 6 Prizes, then draw turn by turn ----
function newHand() {
  const deck = []; open.cards.forEach(l => { for (let k = 0; k < l.n; k++) deck.push(l) });
  let mull = -1, h;
  do {
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [deck[i], deck[j]] = [deck[j], deck[i]] }
    h = deck.slice(0, 7); mull++;
  } while (!h.some(l => { const c = cardOf(l); return c?.c === "P" && ENG.stage(c) === 0 }) && mull < 10 && deck.length >= 7);
  hand = { cards: h, prizes: deck.slice(7, 13), rest: deck.slice(13), mull, reveal: false, turn: 0 };
}
function renderTest() {
  const el = deckview.querySelector(".tst");
  if (open.cards.length && sum(open.cards) < 13) { el.innerHTML = `<p class="empty">Add at least 13 cards to draw a test hand.</p>`; return }
  if (!open.cards.length) { el.innerHTML = `<p class="empty">Add cards to draw a test hand.</p>`; return }
  if (!hand) newHand();
  const fs = ENG.roles(expand(open.cards), open.roles), key = new Set(fs.filter(f => f.role !== "S").map(f => f.root));
  const prized = hand.prizes.filter(l => key.has(cardOf(l)?.root));
  const tile = l => `<img loading="lazy" alt="${esc(l.name)}" title="${esc(l.name)}" src="${thumb(l)}">`;
  el.innerHTML = `
    <div class="th-tools">
      <button class="pill sm on" data-th="new">🔄 New hand</button>
      <button class="pill sm" data-th="draw" ${hand.rest.length ? "" : "disabled"}>＋ Draw (turn ${hand.turn + 1})</button>
      <button class="pill sm" data-th="prizes">${hand.reveal ? "Hide" : "Reveal"} Prizes</button>
      <span class="sub">${hand.mull ? `⚠ ${hand.mull} mulligan${hand.mull > 1 ? "s" : ""} before a Basic · ` : ""}${hand.rest.length} cards left in deck</span>
    </div>
    ${prized.length ? `<div class="dw">⚠ Prized key cards: ${prized.map(l => esc(l.name)).join(", ")}</div>` : ""}
    <div class="lbl">Hand · ${hand.cards.length}</div><div class="th-row">${hand.cards.map(tile).join("")}</div>
    <div class="lbl">Prizes</div><div class="th-row prizes">${hand.prizes.map(l => hand.reveal ? tile(l) : `<span class="back"></span>`).join("")}</div>`;
}

function deckChanged(c) {               // after any change: autosave, then refresh only what shows it
  save();
  const tile = c && deckview.querySelector(`.pk[data-k="${c.k}"]`);
  if (tile) {
    const q = inDeck(c), l = lineOf(c);
    tile.classList.toggle("in", q > 0);
    tile.querySelector(".qty").textContent = q ? "×" + q : "";
    tile.querySelector("img").src = imgOf(l ? PRINT.get(l.id)[1] : c.p[0]);
  }
  hand = null;
  renderPanel();
  if (pane === "insights") renderInsights();
  if (pane === "test") renderTest();
  if (!dlg.hidden && zoomCard) renderZoom();
}

function addCard(c, id = lineOf(c)?.id || c.p[0][0]) {
  const why = blocked(open, c);
  if (why) return say(why);
  const l = open.cards.find(x => x.id === id);
  l ? l.n++ : open.cards.push({ id, n: 1, name: c.n, cat: CAT[c.c] });
  deckChanged(c);
}

function removeCard(id) {
  const i = open.cards.findIndex(l => l.id === id);
  if (i < 0) return;
  const c = cardOf(open.cards[i]);
  if (--open.cards[i].n <= 0) { if (open.cover === id) open.cover = null; open.cards.splice(i, 1) }
  deckChanged(c);
}

// picking another print moves the deck's copies of this card onto that art
function choosePrint(c, id) {
  zoomPrint = id;
  const ls = open.cards.filter(l => cardOf(l) === c);
  if (!ls.length) return renderZoom();
  const n = sum(ls), cover = ls.some(l => l.id === open.cover);
  open.cards = open.cards.filter(l => !ls.includes(l));
  open.cards.push({ id, n, name: c.n, cat: CAT[c.c] });
  if (cover) open.cover = id;
  deckChanged(c);
}

// ---- deck lists as Pokémon TCG Live / Limitless write them: "4 Charmander PAF 7" ----
const SYM = { G: "grass", R: "fire", W: "water", L: "lightning", P: "psychic", F: "fighting", D: "darkness", M: "metal" };
const norm = s => s.toLowerCase().replace(/\{(\w)\}/g, (_, k) => SYM[k.toUpperCase()] || k)
  .replace(/[’`]/g, "'").replace(/^basic\s+/, "").replace(/\s+/g, " ").trim();
let BY_NAME;

function parseList(text) {
  BY_NAME ||= new Map([...CARDS.cards].reverse().map(c => [norm(c.n), c]));
  const cards = [], miss = [];
  for (const raw of text.split(/\r?\n/)) {
    const m = raw.trim().match(/^(\d+)x?\s+(.+?)(?:\s+([A-Za-z0-9-]{2,7})\s+([A-Za-z]{0,4}\d+[a-z]?))?$/);
    if (!m) continue;                                  // section headers, "Total Cards: 60", blanks
    const [, n, name, code, num] = m;
    // exact print by set code + number first, then by name (a reprint, or a code we don't know)
    let id = code && (BY_CODE.get(`${code} ${num}`.toUpperCase()) || BY_CODE.get(`${code} ${num.replace(/^0+/, "")}`.toUpperCase()));
    const c = id ? PRINT.get(id)[0] : BY_NAME.get(norm(name));
    if (!c) { miss.push(raw.trim()); continue }
    id ||= c.p[0][0];
    const l = cards.find(x => x.id === id);
    l ? l.n += +n : cards.push({ id, n: +n, name: c.n, cat: CAT[c.c] });
  }
  return { cards, miss };
}

function listText(d) {
  const t = tally(d);
  return Object.values(CAT).map(k => {
    const ls = d.cards.filter(l => l.cat === k);
    return ls.length ? `${k}: ${t[k]}\n` + ls.map(l => {
      const p = PRINT.get(l.id)?.[1];
      return `${l.n} ${l.name}${p ? ` ${p[1]} ${p[2]}` : ""}`;
    }).join("\n") : "";
  }).filter(Boolean).join("\n\n") + `\n\nTotal Cards: ${t.total}`;
}

async function exportDeck(d) {
  const text = listText(d);
  try { await navigator.clipboard.writeText(text); say("Deck list copied") }
  catch {                                              // no clipboard access: show it to copy by hand
    zoomCard = null; dlg.hidden = false;
    dlgBox.innerHTML = `
      <div class="m-head"><div><h2>${esc(d.name)}</h2><div class="sub">Copy this list.</div></div>
        <button class="x" data-z="close">✕</button></div>
      <div class="imp"><textarea id="exp-text" readonly>${esc(text)}</textarea></div>`;
    dlgBox.querySelector("textarea").select();
  }
}

const newDeck = (name, cards = [], notes = "") => {
  const d = { name: uniqueName(name), notes, cover: null, cards, tags: [], roles: {}, versions: [] };
  decks.push(d); save();
  return d;
};

function doImport() {
  const { cards, miss } = parseList(dlgBox.querySelector("#imp-text").value);
  if (!cards.length) {
    dlgBox.querySelector("#imp-out").textContent = "No card lines recognised — they look like “4 Charmander PAF 7”.";
    return;
  }
  const want = dlgBox.querySelector("#imp-name").value.trim() || "Imported deck", d = newDeck(want, cards);
  openDeck(d); renderDecks();
  if (d.name !== want) say(`“${want}” was taken — saved as “${d.name}”`);
  if (!miss.length) { if (d.name === want) say(`Imported ${sum(cards)} cards`); return }
  dlg.hidden = false;
  dlgBox.querySelector(".imp").innerHTML = `
    <p>Imported ${sum(cards)} cards into “${esc(d.name)}”. ${miss.length} line${miss.length > 1 ? "s" : ""} didn't match
      a legal card and ${miss.length > 1 ? "were" : "was"} skipped:</p>
    <textarea id="exp-text" readonly>${esc(miss.join("\n"))}</textarea>
    <button class="pill on" data-z="close">Open the deck</button>`;
}

function applySwap(x) {
  const add = CARDS.cards[x.addK];
  if (x.rem) { const l = open.cards.find(l => l.name === x.rem); if (l) removeCard(l.id) }
  if (add) addCard(add);
  say(`Swapped${x.rem ? ` −1 ${x.rem}` : ""} +1 ${x.add}`);
}

deckview.addEventListener("click", e => {
  const act = e.target.closest("[data-dk]")?.dataset.dk, tile = e.target.closest(".deck");
  if (act === "new") { const d = newDeck("New deck"); openDeck(d); return renderDecks() }
  if (act === "import") return openImport();
  if (act === "back") { openDeck(null); return renderDecks() }
  if (act === "export") return exportDeck(open);
  const tag = e.target.closest("[data-tag]");
  if (tag) { deckTag = tag.dataset.tag; return renderDeckList() }
  if (tile) {
    const i = +tile.dataset.i, d = decks[i];
    if (act === "dup") {
      const copy = structuredClone(d);
      copy.name = uniqueName(d.name); copy.versions = [];
      decks.splice(i + 1, 0, copy); save(); return renderDecks();
    }
    if (act === "del") {
      if (confirm(`Delete the deck “${d.name}”? This can't be undone.`)) { decks.splice(i, 1); save(); renderDecks() }
      return;
    }
    openDeck(d);
    if (act === "ins") pane = "insights";                       // straight to the tips and matchups
    renderDecks(); return scrollTo(0, 0);                       // Edit, or anywhere on the tile
  }
  if (!open) return;

  const show = e.target.closest("[data-show]")?.dataset.show;
  if (show) {
    pane = show; deckview.querySelector(".ed").dataset.pane = pane;
    renderPanel();
    if (pane === "insights") renderInsights();
    if (pane === "test") renderTest();
    return;
  }
  const cat = e.target.closest("[data-cat]")?.dataset.cat;
  if (cat) {
    pick.cat = cat;
    if (cat !== "all" && cat !== "P") { pick.types.clear(); pick.stages.clear(); pick.ex = false }
    if (cat !== "T") pick.kinds.clear();
    deckview.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("on", b.dataset.cat === cat));
    renderChips(); return renderGrid();
  }
  const chip = e.target.closest("[data-chip]");
  if (chip) {
    const g = chip.dataset.chip, v = chip.dataset.v;
    if (g === "ex") pick.ex = !pick.ex;
    else pick[g].has(v) ? pick[g].delete(v) : pick[g].add(v);
    chip.classList.toggle("on"); return renderGrid();
  }
  const pk = e.target.closest(".pk");
  if (pk) {
    const c = CARDS.cards[+pk.dataset.k];
    return e.target.closest('[data-act="zoom"]') ? openZoom(c) : addCard(c);
  }
  const ln = e.target.closest("[data-ln]");
  if (ln) {
    const id = ln.closest(".ln").dataset.id, c = cardOf({ id });
    if (ln.dataset.ln === "inc" && c) addCard(c, id);
    if (ln.dataset.ln === "dec") removeCard(id);
    if (ln.dataset.ln === "zoom" && c) openZoom(c, id);
    if (ln.dataset.ln === "cover") { open.cover = open.cover === id ? null : id; save(); renderPanel() }
    if (ln.dataset.ln === "role" && c) {             // auto → Attacker → Engine → Support → auto
      const f = ENG.roles(expand(open.cards), open.roles).find(f => f.root === c.root), order = ["A", "E", "S"];
      const was = open.roles[c.root];
      let next = was ? order[order.indexOf(was) + 1] : "A";
      if (next === f.auto) next = order[order.indexOf(next) + 1];   // the auto role is the "auto" step
      if (next) open.roles[c.root] = next; else delete open.roles[c.root];
      deckChanged(null);
    }
    return;
  }
  if (e.target.closest('[data-mu="all"]')) { allMatchups = !allMatchups; return renderInsights() }
  const useful = e.target.closest("[data-useful]");
  if (useful) return addCard(CARDS.cards[+useful.dataset.useful]);
  const swap = e.target.closest("[data-swap]");
  if (swap) return applySwap(SWAPS.get(deckProfile(open)?.key)?.[+swap.dataset.swap] || {});
  const untag = e.target.closest("[data-untag]");
  if (untag) { open.tags = open.tags.filter(t => t !== untag.dataset.untag); save(); return renderInsights() }
  const ver = e.target.closest("[data-ver]");
  if (ver) {
    const v = open.versions[+ver.dataset.i];
    if (ver.dataset.ver === "save") { snapshot(open, deckview.querySelector("#ver-label").value.trim() || "saved"); openedAs = compact(open); say("Version saved"); return renderInsights() }
    if (ver.dataset.ver === "cmp" && v) return compare(v.label || new Date(v.t).toLocaleString(), uncompact(v.list));
    if (ver.dataset.ver === "restore" && v && confirm("Restore this version? The current list is saved as a version first.")) {
      snapshot(open, "before restore"); open.cards = uncompact(v.list); openedAs = compact(open); deckChanged(null); say("Version restored");
    }
    return;
  }
  const th = e.target.closest("[data-th]")?.dataset.th;
  if (th === "new") { newHand(); renderTest() }
  if (th === "draw" && hand.rest.length) { hand.cards.push(hand.rest.shift()); hand.turn++; renderTest() }
  if (th === "prizes") { hand.reveal = !hand.reveal; renderTest() }
});
