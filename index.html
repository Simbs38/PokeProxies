      <button class="pill sm" data-ver="save">📌 Save version</button>
      <select id="cmp-with"><option value="">Compare with…</option>
        ${mine.map(x => `<option value="d:${esc(x.name)}">My deck: ${esc(x.name)}</option>`).join("")}
        ${META.decks.map((m, i) => `<option value="m:${i}">Meta: ${esc(m.name)}</option>`).join("")}</select></div>
    ${d.versions.map((v, i) => `<div class="ver"><span>${new Date(v.t).toLocaleString()}${v.label ? ` · <b>${esc(v.label)}</b>` : ""}</span>
      <small class="sub">${uncompact(v.list).reduce((s, l) => s + l.n, 0)} cards</small>
      <button class="pill sm" data-ver="cmp" data-i="${i}">Compare</button>
      <button class="pill sm" data-ver="restore" data-i="${i}">Restore</button></div>`).join("") || `<p class="sub">A version is kept each time you finish editing; 📌 saves one now.</p>`}`;
}

// ---- compare two lists: card by card, and their scores ----
async function compare(label, lines) {
  const a = expand(open.cards), b = expand(lines), names = {};
  open.cards.forEach(l => { names[l.name] = (names[l.name] || 0) + l.n });
  const theirs = {}; lines.forEach(l => { theirs[l.name] = (theirs[l.name] || 0) + l.n });
  const diff = [...new Set([...Object.keys(names), ...Object.keys(theirs)])]
    .map(n => [n, (names[n] || 0) - (theirs[n] || 0)]).filter(x => x[1]).sort((x, y) => y[1] - x[1]);
  zoomCard = null; dlg.hidden = false;
  dlgBox.innerHTML = `<div class="m-head"><div><h2>${esc(open.name)} vs ${esc(label)}</h2><div class="sub">Simulating both…</div></div>
    <button class="x" data-z="close">✕</button></div>`;
  const [pa, pb] = await Promise.all([profile(a, open.roles), profile(b, {})]);
  if (dlg.hidden) return;
  const row = (k, t) => `<tr><td>${t}</td><td>${pa?.score[k] ?? "…"}</td><td>${pb?.score[k] ?? "…"}</td>
    <td class="${(pa?.score[k] ?? 0) >= (pb?.score[k] ?? 0) ? "ok" : "bad"}">${pa && pb ? (pa.score[k] - pb.score[k] > 0 ? "+" : "") + (pa.score[k] - pb.score[k]) : ""}</td></tr>`;
  dlgBox.innerHTML = `<div class="m-head"><div><h2>${esc(open.name)} vs ${esc(label)}</h2>
      <div class="sub">+ means this deck has more</div></div><button class="x" data-z="close">✕</button></div>
    <div class="imp"><table class="cmp"><tr><th></th><th>This deck</th><th>${esc(label)}</th><th></th></tr>
      ${row("total", "Total")}${Object.entries(FACTOR).map(([k, t]) => row(k, t)).join("")}</table>
      <div class="diff">${diff.map(([n, v]) => `<div class="${v > 0 ? "ok" : "bad"}">${v > 0 ? "+" : ""}${v} ${esc(n)}</div>`).join("") || "<div>Same cards.</div>"}</div></div>`;
}

// ---- test hands: an opening 7 and 6 Prizes, then draw turn by turn ----
function newHand() {
  const deck = []; open.cards.forEach(l => { for (let k = 0; k < l.n; k++) deck.push(l) });
  let mull = -1, h;
  do {
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [deck[i], deck[j]] = [deck[j], deck[i]] }
    h = deck.slice(0, 7); mull++;
  } while (!h.some(l => { const c = cardOf(l); return c?.c === "P" && ENG.stage(c) === 0 }) && mull < 10 && deck.length >= 7);
  hand = { cards: h, prizes: deck.slice(7, 13), rest: deck.slice(13), mull, reveal: false, turn: 0 };
}
function renderTest() {
  const el = deckview.querySelector(".tst");
  if (open.cards.length && sum(open.cards) < 13) { el.innerHTML = `<p class="empty">Add at least 13 cards to draw a test hand.</p>`; return }
  if (!open.cards.length) { el.innerHTML = `<p class="empty">Add cards to draw a test hand.</p>`; return }
  if (!hand) newHand();
  const fs = ENG.roles(expand(open.cards), open.roles), key = new Set(fs.filter(f => f.role !== "S").map(f => f.root));
  const prized = hand.prizes.filter(l => key.has(cardOf(l)?.root));
  const tile = l => `<span class="lw"><img loading="lazy" alt="${esc(l.name)}" title="${esc(l.name)}" src="${thumb(l)}">${cardLens(l.id, thumb(l), l.name)}</span>`;
  el.innerHTML = `
    <div class="th-tools">
      <button class="pill sm on" data-th="new">🔄 New hand</button>
      <button class="pill sm" data-th="draw" ${hand.rest.length ? "" : "disabled"}>＋ Draw (turn ${hand.turn + 1})</button>
      <button class="pill sm" data-th="prizes">${hand.reveal ? "Hide" : "Reveal"} Prizes</button>
      <span class="sub">${hand.mull ? `⚠ ${hand.mull} mulligan${hand.mull > 1 ? "s" : ""} before a Basic · ` : ""}${hand.rest.length} cards left in deck</span>
    </div>
    ${prized.length ? `<div class="dw">⚠ Prized key cards: ${prized.map(l => esc(l.name)).join(", ")}</div>` : ""}
    <div class="lbl">Hand · ${hand.cards.length}</div><div class="th-row">${hand.cards.map(tile).join("")}</div>
    <div class="lbl">Prizes</div><div class="th-row prizes">${hand.prizes.map(l => hand.reveal ? tile(l) : `<span class="back"></span>`).join("")}</div>`;
}

function deckChanged(c) {               // after any change: autosave, then refresh only what shows it
  save();
  const g = c && NAME_OF.get(c.k), tile = c && deckview.querySelector(`.pk[data-g="${g}"]`);
  if (c && pick.inDeck) renderGrid();                 // a card can leave (or join) the filtered grid
  else if (tile) {
    tile.outerHTML = nameTile(g);
    const vl = deckview.querySelector(`.vlist[data-g="${g}"]`);
    if (vl) vl.outerHTML = versionList(g, "deck");
  }
  hand = null;
  renderPanel();
  if (pane === "insights") renderInsights();
  if (pane === "test") renderTest();
  if (!dlg.hidden && zoomCard) renderZoom();
}

function addCard(c, id = lineOf(c)?.id || c.p[0][0]) {
  const why = blocked(open, c);
  if (why) return say(why);
  const l = open.cards.find(x => x.id === id);
  l ? l.n++ : open.cards.push({ id, n: 1, name: c.n, cat: CAT[c.c] });
  deckChanged(c);
}

function removeCard(id) {
  const i = open.cards.findIndex(l => l.id === id);
  if (i < 0) return;
  const c = cardOf(open.cards[i]);
  if (--open.cards[i].n <= 0) { if (open.cover === id) open.cover = null; open.cards.splice(i, 1) }
  deckChanged(c);
}

// ---- 🔍 a card up close: big image, its prints, its text, − / + in the open deck (or, outside one, what you own) ----
function openZoom(c, id, deck = open) {
  zoomCard = c; zoomDeck = deck; zoomPrint = id || (deck && lineOf(c)?.id) || c.p[0][0];
  dlg.hidden = false; renderZoom();
}

function renderZoom() {
  const c = zoomCard, p = PRINT.get(zoomPrint)[1], q = zoomDeck ? inDeck(c) : 0, why = zoomDeck ? blocked(zoomDeck, c) : "";
  const f = ENG.fx(expandCard(c)), does = [f.draw && `draws ${f.draw}`, f.drawTo && `draws to ${f.drawTo}`,
    f.search.length && `searches ${f.search.map(s => `${s.n} ${s.kind}`).join(", ")}`, f.candy && "Rare Candy",
    f.accel && `attaches ${f.accel} Energy`, f.gust && "gusts", f.sw && "switches", f.recover && "recovers"].filter(Boolean);
  dlgBox.innerHTML = `
    <div class="m-head">
      <div><h2>${c.n}</h2><div class="sub">${[CAT[c.c], ...c.sub, c.hp && c.hp + " HP"].filter(Boolean).join(" · ")}</div></div>
      <button class="x" data-z="close">✕</button>
    </div>
    <div class="zm-body">
      <img class="zm-img" alt="${c.n}" src="${bigImg(imgOf(p))}" onerror="this.onerror=null;this.src='${imgOf(p)}'">
      <div class="zm-side">
        <div class="lbl">Print · ${esc(CARDS.sets[p[1]] || p[1])}${p[4] != null ? ` · ${money(p[4])}` : p[5] != null ? ` · ${money(p[5], "$")}` : ""}</div>
        <div class="zm-prints">${c.p.map(x => `<button class="chip ${x[0] === zoomPrint ? "on" : ""}"
          data-z="print" data-id="${x[0]}">${x[1]} ${x[2]}${x[4] != null ? ` · ${money(x[4])}` : ""}</button>`).join("")}</div>
        ${does.length ? `<div class="sub">Read as: ${does.join(" · ")}</div>` : ""}
        ${zoomDeck ? `<div class="lbl">In this deck</div>
        <div class="zm-q">
          <button class="pill" data-z="dec" ${q ? "" : "disabled"}>−</button><b>${q}</b>
          <button class="pill" data-z="inc" ${why ? "disabled" : ""}>+</button>
        </div>
        ${why ? `<div class="sub">${why}</div>` : ""}` : `<div class="lbl">You own</div>
        <div class="sub">${isBasicE(c) ? "Basic Energy always counts as owned" : `${stock[zoomPrint] || 0} of this print · ${ownedOf(c)} in all`}</div>`}
      </div>
    </div>`;
}

// picking another print moves the deck's copies of this card onto that art
function choosePrint(c, id) {
  zoomPrint = id;
  if (!zoomDeck) return renderZoom();
  const ls = open.cards.filter(l => cardOf(l) === c);
  if (!ls.length) return renderZoom();
  const n = sum(ls), cover = ls.some(l => l.id === open.cover);
  open.cards = open.cards.filter(l => !ls.includes(l));
  open.cards.push({ id, n, name: c.n, cat: CAT[c.c] });
  if (cover) open.cover = id;
  deckChanged(c);
}

// ---- deck lists as Pokémon TCG Live / Limitless write them: "4 Charmander PAF 7" ----
const SYM = { G: "grass", R: "fire", W: "water", L: "lightning", P: "psychic", F: "fighting", D: "darkness", M: "metal" };
const norm = s => s.toLowerCase().replace(/\{(\w)\}/g, (_, k) => SYM[k.toUpperCase()] || k)
  .replace(/[’`]/g, "'").replace(/^basic\s+/, "").replace(/\s+/g, " ").trim();
let BY_NAME;

function parseList(text) {
  BY_NAME ||= new Map([...CARDS.cards].reverse().map(c => [norm(c.n), c]));
  const cards = [], miss = [];
  for (const raw of text.split(/\r?\n/)) {
    const m = raw.trim().match(/^(\d+)x?\s+(.+?)(?:\s+([A-Za-z0-9-]{2,7})\s+([A-Za-z]{0,4}\d+[a-z]?))?$/);
    if (!m) continue;                                  // section headers, "Total Cards: 60", blanks
    const [, n, name, code, num] = m;
    // exact print by set code + number first, then by name (a reprint, or a code we don't know)
    let id = code && (BY_CODE.get(`${code} ${num}`.toUpperCase()) || BY_CODE.get(`${code} ${num.replace(/^0+/, "")}`.toUpperCase()));
    const c = id ? PRINT.get(id)[0] : BY_NAME.get(norm(name));
    if (!c) { miss.push(raw.trim()); continue }
    id ||= c.p[0][0];
    const l = cards.find(x => x.id === id);
    l ? l.n += +n : cards.push({ id, n: +n, name: c.n, cat: CAT[c.c] });
  }
  return { cards, miss };
}

function listText(d) {
  const t = tally(d);
  return Object.values(CAT).map(k => {
    const ls = d.cards.filter(l => l.cat === k);
    return ls.length ? `${k}: ${t[k]}\n` + ls.map(l => {
      const p = PRINT.get(l.id)?.[1];
      return `${l.n} ${l.name}${p ? ` ${p[1]} ${p[2]}` : ""}`;
    }).join("\n") : "";
  }).filter(Boolean).join("\n\n") + `\n\nTotal Cards: ${t.total}`;
}

async function exportDeck(d) {
  const text = listText(d);
  try { await navigator.clipboard.writeText(text); say("Deck list copied") }
  catch {                                              // no clipboard access: show it to copy by hand
    zoomCard = null; dlg.hidden = false;
    dlgBox.innerHTML = `
      <div class="m-head"><div><h2>${esc(d.name)}</h2><div class="sub">Copy this list.</div></div>
        <button class="x" data-z="close">✕</button></div>
      <div class="imp"><textarea id="exp-text" readonly>${esc(text)}</textarea></div>`;
    dlgBox.querySelector("textarea").select();
  }
}

function openImport() {
  zoomCard = null; dlg.hidden = false;
  dlgBox.innerHTML = `
    <div class="m-head">
      <div><h2>Import a deck list</h2>
        <div class="sub">Paste a list from Pokémon TCG Live or Limitless — lines like “4 Charmander PAF 7”.</div></div>
      <button class="x" data-z="close">✕</button>
    </div>
    <div class="imp">
      <input id="imp-name" placeholder="Deck name" maxlength="60">
      <textarea id="imp-text" placeholder="Pokémon: 12&#10;4 Dreepy TWM 128&#10;…"></textarea>
      <button class="pill on" data-z="import">Import</button>
      <div class="sub" id="imp-out"></div>
    </div>`;
  dlgBox.querySelector("#imp-text").focus();
}

const newDeck = (name, cards = [], notes = "") => {
  const d = { name: uniqueName(name), notes, cover: null, cards, tags: [], roles: {}, versions: [], built: false, holds: {} };
  decks.push(d); save();
  return d;
};

function doImport() {
  const { cards, miss } = parseList(dlgBox.querySelector("#imp-text").value);
  if (!cards.length) {
    dlgBox.querySelector("#imp-out").textContent = "No card lines recognised — they look like “4 Charmander PAF 7”.";
    return;
  }
  const want = dlgBox.querySelector("#imp-name").value.trim() || "Imported deck", d = newDeck(want, cards);
  openDeck(d); renderDecks();
  if (d.name !== want) say(`“${want}” was taken — saved as “${d.name}”`);
  if (!miss.length) { if (d.name === want) say(`Imported ${sum(cards)} cards`); return }
  dlg.hidden = false;
  dlgBox.querySelector(".imp").innerHTML = `
    <p>Imported ${sum(cards)} cards into “${esc(d.name)}”. ${miss.length} line${miss.length > 1 ? "s" : ""} didn't match
      a legal card and ${miss.length > 1 ? "were" : "was"} skipped:</p>
    <textarea id="exp-text" readonly>${esc(miss.join("\n"))}</textarea>
    <button class="pill on" data-z="close">Open the deck</button>`;
}

function applySwap(x) {
  const add = CARDS.cards[x.addK];
  if (x.rem) { const l = open.cards.find(l => l.name === x.rem); if (l) removeCard(l.id) }
  if (add) addCard(add);
  say(`Swapped${x.rem ? ` −1 ${x.rem}` : ""} +1 ${x.add}`);
}

deckview.addEventListener("click", e => {
  const act = e.target.closest("[data-dk]")?.dataset.dk, tile = e.target.closest(".deck");
  if (act === "new") { const d = newDeck("New deck"); openDeck(d); return renderDecks() }
  if (act === "import") return openImport();
  if (act === "back") { openDeck(null); return renderDecks() }
  if (act === "export") return exportDeck(open);
  if (act === "buy") return openToBuy();
  if (act === "built") { open.built = !open.built; save(); renderPanel(); return say(open.built ? "Built — this deck holds its cards first" : "No longer marked as built") }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const id = mv.closest(".ln").dataset.id, c = cardOf({ id }), line = open.cards.find(l => l.id === id);
    moveFrom(open, decks[+mv.dataset.move], c, line);
    renderPanel(); return renderGrid();
  }
  const tag = e.target.closest("[data-tag]");
  if (tag) { deckTag = tag.dataset.tag; return renderDeckList() }
  if (tile) {
    const i = +tile.dataset.i, d = decks[i];
    if (act === "dup") {
      const copy = structuredClone(d);
      copy.name = uniqueName(d.name); copy.versions = []; copy.built = false; copy.holds = {};   // a variant holds nothing yet
      decks.splice(i + 1, 0, copy); save(); return renderDecks();
    }
    if (act === "del") {
      if (confirm(`Delete the deck “${d.name}”? This can't be undone.`)) { decks.splice(i, 1); save(); renderDecks() }
      return;
    }
    openDeck(d);
    if (act === "ins") pane = "insights";                       // straight to the tips and matchups
    renderDecks(); return scrollTo(0, 0);                       // Edit, or anywhere on the tile
  }
  if (!open) return;

  const show = e.target.closest("[data-show]")?.dataset.show;
  if (show) {
    pane = show; deckview.querySelector(".ed").dataset.pane = pane;
    renderPanel();
    if (pane === "insights") renderInsights();
    if (pane === "test") renderTest();
    return;
  }
  const cat = e.target.closest("[data-cat]")?.dataset.cat;
  if (cat) {
    pick.cat = cat;
    if (cat !== "all" && cat !== "P") { pick.types.clear(); pick.stages.clear(); pick.ex = false }
    if (cat !== "T") pick.kinds.clear();
    deckview.querySelectorAll("[data-cat]").forEach(b => b.classList.toggle("on", b.dataset.cat === cat));
    renderChips(); return renderGrid();
  }
  const chip = e.target.closest("[data-chip]");
  if (chip) {
    const g = chip.dataset.chip, v = chip.dataset.v;
    if (g === "ex" || g === "own" || g === "inDeck") pick[g] = !pick[g];
    else pick[g].has(v) ? pick[g].delete(v) : pick[g].add(v);
    chip.classList.toggle("on"); return renderGrid();
  }
  const pk = e.target.closest(".pk"), vi = e.target.closest(".vi");
  if (vi) {                                           // a variation in an open list
    const [c] = PRINT.get(vi.dataset.id);
    return e.target.closest('[data-act="add"]') ? addCard(c, vi.dataset.id) : openZoom(c, vi.dataset.id);
  }
  if (e.target.closest('.vlist [data-act="close"]')) { listOpen = null; return renderGrid() }
  if (pk) {
    const g = +pk.dataset.g, cs = NAMES[g][1];
    if (e.target.closest('[data-act="zoom"]')) return openZoom(cs.find(inDeck) || cs[0]);
    if (e.target.closest('[data-act="list"]') || cs.length > 1) {
      listOpen = listOpen?.view === "deck" && listOpen.g === g ? null : { view: "deck", g };
      return renderGrid();
    }
    return addCard(cs[0]);
  }
  const ln = e.target.closest("[data-ln]");
  if (ln) {
    const id = ln.closest(".ln").dataset.id, c = cardOf({ id });
    if (ln.dataset.ln === "inc" && c) addCard(c, id);
    if (ln.dataset.ln === "dec") removeCard(id);
    if (ln.dataset.ln === "zoom" && c) openZoom(c, id);
    if (ln.dataset.ln === "cover") { open.cover = open.cover === id ? null : id; save(); renderPanel() }
    if (ln.dataset.ln === "role" && c) {             // auto → Attacker → Engine → Support → auto
      const f = ENG.roles(expand(open.cards), open.roles).find(f => f.root === c.root), order = ["A", "E", "S"];
      const was = open.roles[c.root];
      let next = was ? order[order.indexOf(was) + 1] : "A";
      if (next === f.auto) next = order[order.indexOf(next) + 1];   // the auto role is the "auto" step
      if (next) open.roles[c.root] = next; else delete open.roles[c.root];
      deckChanged(null);
    }
    return;
  }
  if (e.target.closest('[data-mu="all"]')) { allMatchups = !allMatchups; return renderInsights() }
  const useful = e.target.closest("[data-useful]");
  if (useful) return addCard(CARDS.cards[+useful.dataset.useful]);
  const swap = e.target.closest("[data-swap]");
  if (swap) return applySwap(SWAPS.get(deckProfile(open)?.key)?.[+swap.dataset.swap] || {});
  const untag = e.target.closest("[data-untag]");
  if (untag) { open.tags = open.tags.filter(t => t !== untag.dataset.untag); save(); return renderInsights() }
  const ver = e.target.closest("[data-ver]");
  if (ver) {
    const v = open.versions[+ver.dataset.i];
    if (ver.dataset.ver === "save") { snapshot(open, deckview.querySelector("#ver-label").value.trim() || "saved"); openedAs = compact(open); say("Version saved"); return renderInsights() }
    if (ver.dataset.ver === "cmp" && v) return compare(v.label || new Date(v.t).toLocaleString(), uncompact(v.list));
    if (ver.dataset.ver === "restore" && v && confirm("Restore this version? The current list is saved as a version first.")) {
      snapshot(open, "before restore"); open.cards = uncompact(v.list); openedAs = compact(open); deckChanged(null); say("Version restored");
    }
    return;
  }
  const th = e.target.closest("[data-th]")?.dataset.th;
  if (th === "new") { newHand(); renderTest() }
  if (th === "draw" && hand.rest.length) { hand.cards.push(hand.rest.shift()); hand.turn++; renderTest() }
  if (th === "prizes") { hand.reveal = !hand.reveal; renderTest() }
});

// ---- My Cards: every legal card you own, by print, with what it's worth ----
function binderTile(g) {
  const [name, cs] = NAMES[g], own = cs.reduce((s, c) => s + ownedOf(c), 0), prints = cs.reduce((s, c) => s + c.p.length, 0);
  const c0 = cs.find(ownedOf) || cs[0], pr = c0.p.find(x => stock[x[0]]) || c0.p[0];
  return `<div class="pk ${own ? "in" : "unowned"}" data-g="${g}">
    <img loading="lazy" alt="" src="${imgOf(pr)}">${cardLens(pr[0], imgOf(pr), name)}
    ${own ? `<span class="qty">×${own}</span>` : ""}
    <div class="pn">${name}</div>
    ${prints === 1 ? `<span class="vq tile"><button data-own="-1" data-id="${pr[0]}">−</button><b>${own}</b><button data-own="1" data-id="${pr[0]}">+</button></span>`
      : `<button class="vl" data-act="list">${listOpen?.view === "mine" && listOpen.g === g ? "▴ Close" : `▾ ${cs.length > 1 ? `${cs.length} versions` : `${prints} arts`}`}</button>`}
  </div>`;
}
function collectionValue() {
  let eur = 0, usd = 0, copies = 0, cards = 0;
  for (const [id, n] of Object.entries(stock)) {
    const p = PRINT.get(id)?.[1];
    if (!n) continue;
    copies += n; cards++;
    if (p?.[4] != null) eur += p[4] * n; else if (p?.[5] != null) usd += p[5] * n;
  }
  return { eur, usd, copies, cards };
}
const binderValue = () => {
  const v = collectionValue();
  return v.copies ? `${v.copies} cards (${v.cards} different prints) · worth ≈ ${money(v.eur)}${v.usd ? ` + ${money(v.usd, "$")} without a Cardmarket price` : ""}`
    : "Nothing here yet — find a card and tap + for each copy you own";
};
function renderBinder() {
  binderview.style.setProperty("--hh", head.offsetHeight + "px");
  binderview.innerHTML = `
    <div class="dk-head"><div><h1>My Cards</h1>
      <div class="sub"><span class="bval">${binderValue()}</span> · Standard-legal cards only · Basic Energy always counts as owned</div></div></div>
    <div class="pk-tools">
      <input id="bk-q" type="search" placeholder="Search names and card text…" autocomplete="off" value="${esc(bpick.q)}">
      <div class="seg pk-cat">${Object.entries({ all: "All", ...CAT }).map(([val, t]) =>
        `<button data-cat="${val}" class="${bpick.cat === val ? "on" : ""}">${t}</button>`).join("")}</div>
      <div class="chips">${chipsHTML(bpick)}</div>
    </div>
    <div class="pk-grid bgrid"></div>`;
  renderBinderGrid();
}
function renderBinderGrid() {
  const shown = shownNames(bpick);
  binderview.querySelector(".bgrid").innerHTML = shown.length
    ? shown.map(([, g]) => binderTile(g) + (listOpen?.view === "mine" && listOpen.g === g ? versionList(g, "mine") : "")).join("")
    : `<p class="empty">${bpick.own ? "You haven't added any cards that match." : "No legal cards match these filters."}</p>`;
}
function setOwned(id, delta) {
  const n = Math.max(0, (stock[id] || 0) + delta);
  if (n) stock[id] = n; else delete stock[id];
  save();
  const g = NAME_OF.get(PRINT.get(id)[0].k), tile = binderview.querySelector(`.pk[data-g="${g}"]`);
  if (tile) tile.outerHTML = binderTile(g);
  const vl = binderview.querySelector(`.vlist[data-g="${g}"]`);

}
binderview.addEventListener("click", e => {

// ---- Trade: a binder of cards set aside to trade, apart from My Cards. Pick copies to put a trade together
// and see what it's worth; Trade out takes them out of the binder (or My Cards, for extras) into the Traded log ----
const tpick = { cat: "all", types: new Set(), stages: new Set(), kinds: new Set(), ex: false, q: "", own: false };   // Add cards
const xpick = { cat: "all", types: new Set(), stages: new Set(), kinds: new Set(), ex: false, q: "", own: true };    // extras: My Cards only
const tlook = { mode: "binder", q: "", sort: store.get("tradeSort", "cost"), view: store.get("tradeView", "list") };
const tsel = new Map();                          // "trade:<id>" / "mine:<id>" -> copies in the trade being put together
const selOf = (from, id) => tsel.get(from + ":" + id) || 0;
const stepper = (from, id, n, max, cls = "") => `<span class="vq ${cls}"><button data-sel="-1" data-from="${from}" data-id="${esc(id)}" ${n ? "" : "disabled"}>−</button>
  <b>${n}</b><button data-sel="1" data-from="${from}" data-id="${esc(id)}" ${n >= max ? "disabled" : ""}>+</button></span>`;
const asCard = (id, n, from) => { const [c, p] = PRINT.get(id) || []; return c && { c, p, n, from, ...priceOf(p) } };
const tradeRows = () => Object.entries(trade).filter(([, n]) => n > 0).map(([id, n]) => asCard(id, n, "trade")).filter(Boolean);
// never more than the copies still there (My Cards can change on its own page)
const selRows = () => [...tsel].map(([k, n]) => { const i = k.indexOf(":"), from = k.slice(0, i), id = k.slice(i + 1);
  return asCard(id, Math.min(n, (from === "mine" ? stock : trade)[id] || 0), from) }).filter(x => x?.n);
const nCards = xs => xs.reduce((s, x) => s + x.n, 0);
// a card your decks still lack (a Trade binder copy could fill it), or copies a deck holds (an extra from My Cards)
function tradeWarn(c, from, n) {
  if (isBasicE(c)) return "";
  const A = allocation();
  if (from === "mine") {
    const held = A.got.reduce((s, m) => s + (m.get(c.k) || 0), 0);
    return n > ownedOf(c) - held ? `⚠ in ${decks.filter((d, i) => A.got[i].get(c.k)).map(d => esc(d.name)).join(", ")}` : "";
  }
  const short = A.need.reduce((s, m) => s + (m.get(c.k) || 0), 0) - ownedOf(c);
  return short > 0 ? `⚠ your decks are ${short} short of this` : "";
}

function renderTrade() {

const listBtn = (g, view, label) => `<button class="vl" data-act="list">${listOpen?.view === view && listOpen.g === g ? "▴ Close" : `▾ ${label}`}</button>`;

function renderTraded() {
  tradeview.querySelector(".tr-body").innerHTML = traded.length ? traded.map((e, i) => [e, i]).reverse().map(([e, i]) => {
    const xs = e.items.map(x => { const [c, p] = PRINT.get(x.id) || [];
      return { c: c || { n: x.id, c: "T", t: [], sub: [] }, p: p || [x.id, "", "", CARD_IMG(x.id)], n: x.n, each: x.each, sym: x.sym || "€", from: x.from } });
    return `<div class="tr-log"><div class="tr-lh"><b>${new Date(e.t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</b>

        <button class="pill sm" data-undo="${i}" title="Put these cards back where they came from">↶ Undo</button></div>

function setTrade(id, d) {
  const n = Math.max(0, (trade[id] || 0) + d);
  if (n) trade[id] = n; else delete trade[id];
  if (selOf("trade", id) > n) n ? tsel.set("trade:" + id, n) : tsel.delete("trade:" + id);
  save(); renderTradePickGrid(); tradeHead();
}
function setSel(from, id, d) {
  const max = (from === "mine" ? stock : trade)[id] || 0, n = Math.min(max, Math.max(0, selOf(from, id) + d));
  if (n) tsel.set(from + ":" + id, n); else tsel.delete(from + ":" + id);
  tlook.mode === "binder" ? renderTradeList() : renderTradePickGrid();
  renderTradeBar();
}
function confirmTradeOut() {
  const sel = selRows(), n = nCards(sel), warns = sel.map(x => { const w = tradeWarn(x.c, x.from, x.n); return w && `${x.n}× ${esc(x.c.n)}: ${w}` }).filter(Boolean);
  zoomCard = null; dlg.hidden = false;
  dlgBox.innerHTML = `<div class="m-head"><div><h2>⇄ Trade out ${n} card${n > 1 ? "s" : ""}?</h2>
      <div class="sub">≈ ${buyTotal(sel)} · they leave your Trade binder${sel.some(x => x.from === "mine") ? " and My Cards" : ""} · Traded keeps a record you can undo</div></div>
      <button class="x" data-z="close">✕</button></div>
    <div class="imp">${warns.length ? `<ul class="iss">${warns.map(w => `<li>${w}</li>`).join("")}</ul>` : ""}
      ${cardsHTML(sel, "list", x => ({ note: x.from === "mine" ? "from My Cards" : "" }))}
      <button class="pill on" data-z="tradeout">⇄ Trade out</button></div>`;
  dlgBox.querySelector('[data-z="tradeout"]').onclick = () => {
    for (const x of sel) {
      const box = x.from === "mine" ? stock : trade, left = (box[x.p[0]] || 0) - x.n;
      if (left > 0) box[x.p[0]] = left; else delete box[x.p[0]];
    }
    traded.push({ t: Date.now(), items: sel.map(x => ({ id: x.p[0], n: x.n, from: x.from, each: x.each, sym: x.sym })) });
    tsel.clear(); save(); dlg.hidden = true; say(`Traded out ${n} card${n > 1 ? "s" : ""}`); renderTrade();
  };
}
function undoTrade(i) {
  const e = traded[i]; if (!e) return;
  e.items.forEach(x => { const box = x.from === "mine" ? stock : trade; box[x.id] = (box[x.id] || 0) + x.n });
  traded.splice(i, 1); save(); say("Trade undone — the cards are back"); renderTrade();
}

// ---- Live prices: Cardmarket € and TCGplayer $ straight from TCGdex, a free public API (no key, no
// sign-in), for every card you own or play. Kept on this device and laid over the site's own prices
// until a data refresh brings newer ones; a card that refresh left unpriced keeps its live price.
const TCGDEX = "https://api.tcgdex.net/v2/en";
const TDX_SET = { "Scarlet & Violet Energies": "sve", "Scarlet & Violet Black Star Promos": "svp",
                  "Scarlet & Violet Promos": "svp", "30th Celebration: Classic Collection": "30th-c" };   // where the names differ
let live = store.get("live", null);                // {t, p: {card id: [€, $]}}
const ANNIV_ID = new Map(COLLECTIONS.anniv.items.map(it => [it.id, it]));
const baked = () => Date.parse((CARDS.fetched || "").replace(" ", "T") + "Z") || 0;   // the Action runs on UTC
const euro = v => v != null ? [v, money(v), "cardmarket trend"] : null;
function applyLive() {
  if (!live?.p) return;
  const newer = live.t > baked();
  for (const [id, [eur, usd]] of Object.entries(live.p)) {
    const p = PRINT.get(id)?.[1], it = ANNIV_ID.get(id);

function priceWant() {
  const ids = new Set([...Object.keys(stock), ...Object.keys(trade), ...decks.flatMap(d => d.cards.map(l => l.id)),
                       ...COLLECTIONS.anniv.items.filter(it => have.has(it.id)).map(it => it.id)]);
  const want = [];                                 // [id, set name, number, card name]
  for (const id of ids) {

    if (p) want.push([id, CARDS.sets[p[1]] || p[1], p[2], c.n]);

// our card -> its TCGdex id: same set (by name), then same number and name; renumbered reprints (the
// Classic Collection keeps its vintage numbers) go by name, twins in order — as fetch_data.py does
async function tdxIds(want) {
  const sid = new Map((await tdxRetry("/sets")).filter(s => !/^(?:[A-Z]\d|P-[A-Z])/.test(s.id)).map(s => [s.name, s.id]));
  const norm = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, ""), nnum = n => String(n).replace(/^0+(?=.)/, "");
  const bySet = new Map(), ids = new Map();
  for (const w of want) {
    const s = TDX_SET[w[1]] || sid.get(w[1]);
    if (s) bySet.set(s, [...bySet.get(s) || [], w]);
  }
  await Promise.all([...bySet].map(async ([s, mine]) => {
    const theirs = [...(await tdxRetry("/sets/" + encodeURIComponent(s)).catch(() => ({}))).cards || []];
    const same = (m, c) => nnum(c.localId) === nnum(m[2]);
    const rules = [(m, c) => same(m, c) && norm(c.name) === norm(m[3])];
    if (mine.filter(m => theirs.some(c => rules[0](m, c))).length * 2 < mine.length)
      rules.push((m, c) => norm(c.name) === norm(m[3]), (m, c) => norm(m[3]).startsWith(norm(c.name)));
    else rules.push(same);                         // same set, same number: only the name is spelt differently
    for (const rule of rules)
      for (const m of mine.filter(m => !ids.has(m[0]))) {
        const i = theirs.findIndex(c => rule(m, c));
        if (i >= 0) { ids.set(m[0], theirs[i].id); theirs.splice(i, 1) }
      }

  return ids;
}

async function refreshPrices() {

  pricing = { done: 0, of: 0 }; priceMsg = "Finding your cards on TCGdex…"; showPricing();
  try {
    const want = priceWant(), ids = await tdxIds(want), queue = [...ids], got = {};
    pricing.of = queue.length; showPricing();
    const worker = async () => {
      for (let x; (x = queue.shift()); ) {
        try {
          const pr = (await tdxRetry("/cards/" + encodeURIComponent(x[1]), 2)).pricing || {}, cm = pr.cardmarket || {}, tp = pr.tcgplayer || {};
          const eur = firstPos([cm.trend, cm.avg30, cm.avg, cm["trend-holo"], cm["avg30-holo"], cm["avg-holo"]]);
          const usd = firstPos(["normal", "holofoil", "reverse-holofoil", ...Object.keys(tp)].map(k => tp[k]?.marketPrice ?? tp[k]?.midPrice));
          if (eur != null || usd != null) got[x[0]] = [eur, usd];
        } catch {}                                 // one card failing keeps its old price
        pricing.done++;
        if (pricing.done % 10 === 0) showPricing();

    await Promise.all(Array.from({ length: 8 }, worker));
    const n = Object.keys(got).length;
    if (!n) throw new Error("TCGdex sent no prices back — try again in a minute");

    live = { t: Date.now(), p: { ...live?.p, ...got } };

  } catch (e) { priceMsg = "Couldn't refresh prices: " + e.message }

    ["Holds", Object.entries(d.holds).map(([id, n]) => `${id}=${n}`).join("; ")],

function deckFromSheet(name, rows) {
  const d = { name, notes: "", cover: null, cards: [], tags: [], roles: {}, versions: [], order: 0, built: false, holds: {} };
  let versions = false;
  rows.forEach((r, i) => {
    if (i && r[2]) { d.cards.push({ id: r[2], n: +r[0] || 1, name: r[1], cat: r[3] || "Trainer" }); if (r[5]) d.cover = r[2] }
    const [k, v = ""] = [r[7], r[8]];
    if (!k) return;
    if (versions) {
      const [when, label = ""] = k.split(" — ");
      d.versions.push({ t: Date.parse(when + "Z") || 0, label, list: v });
    } else if (k === "Notes") d.notes = v;
    else if (k === "Tags") d.tags = v.split(/,\s*/).filter(Boolean);
    else if (k === "Order") d.order = +v || 0;
    else if (k === "Built") d.built = !!v;
    else if (k === "Holds") v.split(/;\s*/).forEach(x => { const [id, n] = x.split("="); if (id && +n) d.holds[id] = +n });   // negative = given away
    else if (k === "Roles") v.split(/;\s*/).forEach(x => { const [root, role] = x.split("="); if (root && role) d.roles[root] = role });
    else if (k === "Versions") versions = true;
  });
  return d;
}

    if (p && id) d.favs["gen1:" + p.i] = { id, img: CARD_IMG(id) };
  }
  for (const [, own, id] of t.anniv || []) if (own) d.have.push(id);
  d.stock = {};
  for (const [, , , id, n] of t.cards || []) if (id && +n) d.stock[id] = +n;
  // no Trade tabs at all (an older Apps Script, or none saved yet) = keep this device's
  if (t.trade) { d.trade = {}; for (const [, , , id, n] of t.trade) if (id && +n) d.trade[id] = +n }
  if (t.traded) {
    const by = new Map();
    for (const [when, , , , id, n, from, price] of t.traded) {
      if (!id || !+n) continue;
      if (!by.has(when)) by.set(when, { t: Date.parse(when + "Z") || 0, items: [] });
      const m = String(price || "").match(/^([€$])([\d,.]+)/);
      by.get(when).items.push({ id, n: +n, from: from === "My Cards" ? "mine" : "trade", each: m ? +m[2].replace(/,/g, "") : null, sym: m ? m[1] : "€" });
    }
    d.traded = [...by.values()].sort((a, b) => a.t - b.t);
  }
  if (r.decks.length) d.decks = r.decks.map(x => deckFromSheet(x.name, x.rows)).sort((a, b) => a.order - b.order);
  else {                                 // the earlier single Decks tab, read once before the switch
    const byDeck = new Map();
    for (const [deck, qty, name, id, cat, cover, notes] of r.oldDecks || []) {
      if (!deck) continue;
      if (!byDeck.has(deck)) byDeck.set(deck, { name: deck, notes: "", cover: null, cards: [], tags: [], roles: {}, versions: [], built: false, holds: {} });
      const dk = byDeck.get(deck);
      if (notes) dk.notes = notes;
      if (id) dk.cards.push({ id, n: +qty || 1, name, cat });
      if (id && cover) dk.cover = id;
    }
    d.decks = [...byDeck.values()];
  }
  d.decks.forEach(x => delete x.order);
  return d;
}

function applyState(d) {
  have.clear(); (d.have || []).forEach(x => have.add(x));
  Object.keys(favs).forEach(k => delete favs[k]);
  Object.entries(d.favs || {}).forEach(([k, v]) => { if (k.split(":")[0] in COLLECTIONS) favs[k] = v });
  if (d.stock) { Object.keys(stock).forEach(k => delete stock[k]); Object.assign(stock, d.stock) }
  if (d.trade) { Object.keys(trade).forEach(k => delete trade[k]); Object.assign(trade, d.trade) }
  if (d.traded) traded.splice(0, traded.length, ...d.traded);
  if (d.decks) {                 // the old state JSON and older backups carry none: keep this device's
    decks.splice(0, decks.length, ...d.decks);
    decks.forEach(x => { x.tags ||= []; x.roles ||= {}; x.versions ||= []; x.holds ||= {}; x.built = !!x.built });
    open &&= decks.find(x => x.name === open.name) || null;
  }
  save(false); render();
}

const status = (t, on) => { sync.textContent = t; sync.title = t; sync.classList.toggle("on", !!on) };

async function pull() {
  if (!cfg.url || !cfg.tok) return status("☁ Sign in");
  status("☁ Syncing…");
  try {
    const d = await (await fetch(`${cfg.url}?v=4&idToken=${encodeURIComponent(cfg.tok)}`)).json();
    if (!d.ok) {
      if (/sign in/i.test(d.error || "")) return expired();
      throw new Error(/reload/.test(d.error || "") ? "update the Apps Script first" : d.error || "rejected");
    }
    // an older script would hand back no My Cards (or no decks), wiping this device's on apply ->
    // never sync with one
    if (d.v !== 4) throw new Error("update the Apps Script first");
    cfg.ready = true;
    cfg.tradeTabs = !!d.tabs && "trade" in d.tabs;   // an Apps Script from before the Trade tabs drops them on save
    cfg.pubTabs = !!d.tabs && "wants" in d.tabs;     // ...and one from before the landing page keeps no Looking for tab
    // whichever side was written last wins — plain and predictable for one person, two devices.
    // A change this device couldn't save yet counts as written when it was made, so it goes up now
    // rather than waiting for the next edit. No "dirty" at all = an older site, which could drop
    // saves without a word: send everything once to be sure.
    // No tabs yet = first run on the new script: the old state JSON comes along once to fill them.
    const remote = d.tabs ? fromTabs(d) : d.legacy, dirty = store.get("dirty", null);
    if (remote && (d.updated || 0) > Math.max(store.get("updated", 0), dirty || 0)) {
      applyState(remote);
      store.set("updated", d.updated);
      store.set("dirty", 0);
    } else if (!d.tabs || dirty !== 0 || store.get("updated", 0) > (d.updated || 0)) push(0);
    if (cfg.pubTabs && !d.tabs.wants) push(0);       // just updated the script: fill the landing page's list once
    status("☁ Synced", true);
  } catch (e) { status("☁ " + e.message) }
}

let saving = Promise.resolve();                    // the save in flight, so Log out can wait for it
function push(wait = 900) {
  if (!cfg.url || !cfg.tok || !cfg.ready) return;   // the change stays "dirty": the next pull sends it
  clearTimeout(timer);
  timer = setTimeout(() => saving = send(), wait);
}
async function send() {
  const updated = Date.now(), sent = store.get("dirty", null);
  status("☁ Saving…");
  try {
    // text/plain keeps it a simple request: no CORS preflight, which Apps Script cannot answer
    const d = await (await fetch(cfg.url, {
      method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ idToken: cfg.tok, v: 4, updated, ...tabsOut() }),
    })).json();
    if (!d.ok) throw new Error(d.error || "rejected");
    store.set("updated", updated);
    if (store.get("dirty", null) === sent) store.set("dirty", 0);   // an edit made mid-save still waits
    status("☁ Synced", true);
  } catch (e) { /sign in/i.test(e.message) ? expired() : status("☁ " + e.message) }
}

// ---- Data: how fresh each dataset is, and a button that refreshes them all ----
// A GitHub Action re-runs fetch_data.py and republishes the site; the Apps Script starts it, since it
// holds the only token allowed to. The run list is public, read straight from GitHub.
const RUNS = "https://api.github.com/repos/Simbs38/PokeProxies/actions/workflows/refresh-data.yml/runs?per_page=6";
let runs = null, runsT, refreshMsg = "", published = false;
const showRuns = () => cur === "data" && renderData();
async function loadRuns() {
  try { runs = (await (await fetch(RUNS)).json()).workflow_runs || [] } catch { runs = [] }
  const last = runs[0], ended = last?.status === "completed" ? Date.parse(last.updated_at) : 0;
  if (ended && last.conclusion === "success" && !published) published = await isPublished();
  if (cur !== "data") return;
  showRuns();
  clearTimeout(runsT);
  // follow a run in progress, then the Pages build after it (a few minutes) until the new data is live
  if (runs.some(r => r.status !== "completed") || (!published && ended > Date.now() - 15 * 6e4)) runsT = setTimeout(loadRuns, 20000);
}
// the site republishes with new ?v= stamps on its data files: a different stamp live = newer data than this page
async function isPublished() {
  try {
    const live = (await (await fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" })).text()).match(/cards\.js\?v=\d+/);
    return !!live && live[0] !== document.querySelector('script[src^="cards.js"]')?.getAttribute("src");
  } catch { return false }
}
const freshness = s => {
  if (!s) return `<span class="fresh old">never</span>`;
  const days = (Date.now() - Date.parse(s.replace(" ", "T"))) / 864e5;
  return `<span class="fresh ${days < 8 ? "ok" : days < 31 ? "mid" : "old"}" title="${esc(s)}">${days < 1 ? "today" : `${Math.round(days)} day${Math.round(days) === 1 ? "" : "s"} ago`}</span>`;
};
const runLine = r => {
  const mins = r.updated_at && r.run_started_at ? Math.round((Date.parse(r.updated_at) - Date.parse(r.run_started_at)) / 60000) : 0;
  const icon = r.status !== "completed" ? "⏳ running" : r.conclusion === "success" ? "✓ done" : `✕ ${r.conclusion}`;
  return `<div class="run"><b class="${r.conclusion === "success" ? "ok" : r.status !== "completed" ? "" : "bad"}">${icon}</b>
    <span>${new Date(r.created_at).toLocaleString()} · ${r.event === "schedule" ? "weekly" : "manual"}${mins ? ` · ${mins} min` : ""}</span>
    <a href="${r.html_url}" target="_blank" rel="noopener">log ↗</a></div>`;
};
// ms the Google ID token has left, read from the token itself (0 when there is none)
const tokLeft = () => { try { return JSON.parse(atob(cfg.tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1e3 - Date.now() } catch { return 0 } };
let refreshAfterSignIn = false, needToken = false;
function signInThenRefresh() {                     // the token ran out (~1h): sign in, then onGoogle starts it

}
async function refreshData() {

  try {
    // no sync version on purpose: an older script answers "reload" instead of reading it as a save
    const d = await (await fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ idToken: cfg.tok, action: "refresh" }) })).json();
    if (!d.ok && /sign in/i.test(d.error || "")) return signInThenRefresh();
    needToken = !d.ok && /GITHUB_TOKEN/.test(d.error || "");
    refreshMsg = d.ok ? "Started: all prices, new cards and the meta. It takes about 10–15 minutes, then the site republishes itself and a Reload button shows up here."
      : needToken ? "Refresh data needs a one-time GitHub token in your Apps Script:"
      : /reload/.test(d.error || "") ? "Your Apps Script is the previous version — paste the new one and deploy it first."
      : /GitHub said 401/.test(d.error || "") ? "GitHub refused the token in your Apps Script (expired or revoked?) — make a new one as below and replace GITHUB_TOKEN."
      : "Couldn't start: " + d.error;

const TOKEN_HELP = `<ol class="sub tok-help">
  <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Make a fine-grained GitHub token ↗</a>:
    Repository access → <b>Only select repositories → PokeProxies</b>; Permissions → Repository → <b>Actions: Read and write</b>. Copy it.</li>
  <li>Apps Script → <b>Project Settings ⚙ → Script Properties → Add script property</b>: <code>GITHUB_TOKEN</code> = the token. No redeploy needed.</li>

// ---- New sets: one that pokemontcg.io lists and the site doesn't have yet, added on this device in a
// few seconds (no token, no sign-in) and kept until a data refresh bakes it in for every device ----
const PTCG = "https://api.pokemontcg.io/v2";
const PTCG_FIELDS = "id,name,supertype,subtypes,types,hp,number,set,images,nationalPokedexNumbers,attacks,abilities,"
  + "rules,weaknesses,resistances,retreatCost,evolvesFrom,cardmarket,tcgplayer";
let fresh, freshErr = "", adding = null, checking = false;   // fresh: sets to offer once checked; adding: {name, done, of}
const getJSON = async (url, tries = 4) => {        // pokemontcg.io throws the odd 500/502: retry, slower each time
  for (let i = 0; ; i++) {
    try { const r = await fetch(url); if (r.ok) return await r.json(); throw new Error(`${new URL(url).host} said ${r.status}`) }
    catch (e) { if (i >= tries - 1) throw e; await new Promise(r => setTimeout(r, 1000 * (i + 1))) }
  }
};
const legalQ = id => `set.id:${id} (${(CARDS.legal || []).map(m => "regulationMark:" + m).join(" OR ")})`;
const ptcgCards = (q, extra = "") => `${PTCG}/cards?q=${encodeURIComponent(q)}${extra}`;
async function findSets() {
  if (checking) return;
  checking = true; fresh = undefined; freshErr = ""; showRuns();
  try {
    const known = new Set(Object.values(CARDS.sets));
    const sets = (await getJSON(`${PTCG}/sets?orderBy=-releaseDate&pageSize=12&select=id,name,ptcgoCode,releaseDate`)).data
      .filter(s => !known.has(s.name));
    // only sets with Standard-legal cards: the Classic Collection reprints and older sets never show
    fresh = (await Promise.all(sets.map(async s =>
      ({ ...s, n: (await getJSON(ptcgCards(legalQ(s.id), "&pageSize=1&select=id"))).totalCount })))).filter(s => s.n);
  } catch (e) { freshErr = e.message; fresh = [] }
  checking = false; showRuns();
}
// a pokemontcg.io card in cards.js's shape, as fetch_data.py writes it
const cents = v => v ? Math.round(v * 100) / 100 : null;
function asCardsJs(c, code) {
  const L = ENG.TL, hp = parseInt(c.hp), types = ls => (ls || []).map(w => L[w.type] || "").join("") || undefined;
  const cm = c.cardmarket?.prices || {}, tp = Object.values(c.tcgplayer?.prices || {});
  const img = c.images?.small === `https://images.pokemontcg.io/${c.set.id}/${c.number}.png` ? "" : c.images?.small || "";
  return JSON.parse(JSON.stringify({        // drops what's undefined, as the fetcher drops None
    n: c.name, c: c.supertype[0], sub: c.subtypes || [], t: c.types || [], hp: hp > 0 ? hp : undefined,
    dex: c.nationalPokedexNumbers?.[0], ef: c.evolvesFrom,
    atk: c.attacks?.length ? c.attacks.map(a => [a.name, (a.cost || []).map(e => L[e] || "C").join(""), a.damage || "", a.text || ""]) : undefined,
    ab: c.abilities?.length ? c.abilities.map(a => [a.name, a.text || ""]) : undefined,
    rt: (c.rules || []).join(" ") || undefined, wk: types(c.weaknesses), rs: types(c.resistances),
    rc: c.supertype[0] === "P" ? (c.retreatCost || []).length : undefined,
    p: [[c.id, code, c.number, img, cents(cm.trendPrice || cm.averageSellPrice || cm.avg30),
         cents(tp.map(p => p.market || p.mid).find(Boolean))]],
  }));
}
async function addSet(id) {
  const s = fresh?.find(x => x.id === id);
  if (!s || adding) return;
  adding = { name: s.name, done: 0, of: s.n }; showRuns();
  try {
    const raw = [];
    for (let page = 1; raw.length < s.n; page++) {
      const r = await getJSON(ptcgCards(legalQ(s.id), `&pageSize=250&page=${page}&select=${PTCG_FIELDS}`));
      if (!r.data.length) break;
      raw.push(...r.data); adding.done = raw.length; showRuns();
    }
    const code = s.ptcgoCode || s.id.toUpperCase(), groups = new Map();
    for (const c of raw) {                         // one entry per distinct card, its prints inside
      const x = asCardsJs(c, code), k = cardKey(x);
      if (groups.has(k)) groups.get(k).p.push(...x.p); else groups.set(k, x);
    }
    const ex = EXTRA || { sets: {}, cards: [] };
    ex.sets[code] = { id: s.id, name: s.name, date: s.releaseDate, n: raw.length };
    ex.cards.push(...groups.values());
    store.set("extraSets", ex);
    adding.done = -1; showRuns();                  // "added": the card list is rebuilt on load
    location.reload();
  } catch (e) { adding = null; freshErr = `Couldn't add ${s.name}: ${e.message}`; showRuns() }
}
function removeSet(code) {
  if (!EXTRA?.sets[code]) return;
  delete EXTRA.sets[code];
  EXTRA.cards = EXTRA.cards.map(c => ({ ...c, p: c.p.filter(p => p[1] !== code) })).filter(c => c.p.length);
  store.set("extraSets", Object.keys(EXTRA.sets).length ? EXTRA : null);
  location.reload();
}

  status("☁ Sign in");
  applyLock();
  login.hidden = false; drawGsi();
  if (fresh) { msg.textContent = "That Google account isn't on the allow list — this page stays read only."; return window.google?.accounts?.id?.disableAutoSelect() }
  msg.textContent = store.get("dirty", 0) ? "Sign in again to save your latest changes" : "Your sign-in ran out — sign in again";
  window.google?.accounts?.id?.prompt();
}

// Signed out: the app hides and the read-only landing page shows instead. Cosmetic only — the
// card data is public either way; the collection is what the Apps Script actually guards.
function applyLock() {
  const was = document.body.classList.contains("locked");
  document.body.classList.toggle("locked", !cfg.tok);
  if (!cfg.tok && !was) { renderLanding(); loadLanding() }
  if (cfg.tok && was) render();                     // the app was drawn while hidden: lay it out again
}

// Log out waits for any save still on its way, so the public page shows the last edit
async function logOut() {
  await saving;
  if (cfg.ready && store.get("dirty", 0)) { clearTimeout(timer); await (saving = send()) }
  cfg.tok = ""; cfg.ready = false;
  store.set("syncTok", "");
  window.google?.accounts?.id?.disableAutoSelect();
  status("☁ Sign in"); login.hidden = true; closeMenu(); applyLock();
  scrollTo({ top: 0 });
}

const openLogin = () => {
  document.getElementById("l-msg").textContent = "";
  login.hidden = false;
  drawGsi();
};
sync.onclick = openLogin;
loginbtn.onclick = openLogin;
logout.onclick = logOut;
login.addEventListener("click", e => { if (e.target === login) login.hidden = true });
document.getElementById("l-out").onclick = logOut;

// ---- landing: what anyone with the link sees signed out — read only, straight from the Sheet ----
// The Apps Script hands the Trade and Looking for tabs to anyone (?public=1); cards are drawn from the
// site's own card data by id, so they get art and today's prices. The last copy is kept per device so
// the page draws at once; a fresh one follows.
const LP_TABS = { want: ["🔎 Looking for", "lookingfor"], have: ["⇄ For trade", "fortrade"] };
const LP_SORT = { name: "Name", set: "Set", price: "Price ↓" };
const lp = { tab: location.hash === "#fortrade" ? "have" : "want", q: "", grp: "all", sort: "name",
             view: store.get("lpView", "grid"), data: store.get("pub", null), err: "", loading: false };
const GEN1_BY = new Map(COLLECTIONS.gen1.items.map(p => [p.name, p]));
const priceIn = t => { const m = String(t || "").match(/^([€$])([\d,.]+)/); return m ? { each: +m[2].replace(/,/g, ""), sym: m[1] } : { each: null, sym: "€" } };

// a Sheet row [Card, Set, Number, Card ID, Qty, For|Category, Price] -> what a tile needs
function lpItem(r, tab) {
  const [name, set, num, id, n, grp, price] = r, hit = id && PRINT.get(id), an = id && ANNIV_ID.get(id);
  const x = { id, n: +n || 1, grp: tab === "want" ? grp : "", name, set: [set, num].filter(Boolean).join(" "), ...priceIn(price) };
  if (hit) {
    const [c, p] = hit;
    Object.assign(x, { name: c.n, set: `${CARDS.sets[p[1]] || p[1]} ${p[2]}`, img: imgOf(p), kind: CAT[c.c] });
    const live = priceOf(p); if (live.each != null) Object.assign(x, live);
  } else if (an) Object.assign(x, { img: an.img, set: `${an.set} ${an.number}/${an.total ?? "?"}`, kind: an.rarity,
                                    ...(an.price?.[0] != null ? { each: an.price[0], sym: "€" } : {}) });
  else if (grp === WANT.gen1 && tab === "want") {
    const p = GEN1_BY.get(name);
    Object.assign(x, { img: p ? ART(p.id) : "", alt: p ? ART(Number(p.dex)) : "", art: true, set: p ? `#${p.dex}` : "", any: "any card" });
  } else x.img = id ? CARD_IMG(id) : "";
  if (grp === WANT.decks) x.any = "any print";
  return x;
}
const lpItems = tab => (lp.data?.[tab === "want" ? "wants" : "trade"] || []).filter(r => r[0]).map(r => lpItem(r, tab));
const LP_SORTERS = {
  name: (a, b) => a.name.localeCompare(b.name) || a.set.localeCompare(b.set),
  set: (a, b) => a.set.localeCompare(b.set, "en", { numeric: true }) || a.name.localeCompare(b.name),
  price: (a, b) => (b.each ?? -1) - (a.each ?? -1) || a.name.localeCompare(b.name),
};

function lpCard(x) {
  const img = x.img ? `<img loading="lazy" alt="" src="${esc(x.img)}" class="${x.art ? "art" : ""}"${x.alt
    ? ` onerror="this.onerror=null;this.src='${esc(x.alt)}'"` : ""}>` : "";
  const zoom = x.img ? lens(x.img, x.name, x.set, lp.view === "grid" ? "" : "sm") : "", price = x.each != null ? money(x.each, x.sym) : "";
  if (lp.view === "grid") return `<div class="pk">${img}${zoom}<span class="qty">${x.n > 1 ? "×" + x.n : ""}</span>
      <div class="pn">${esc(x.name)}</div><div class="ct-p">${x.any ? `<span class="lp-any">${x.any}</span>` : esc(x.set)}${price ? " · " + price : ""}</div></div>`;
  return `<div class="cr"><span class="lw">${img}${zoom}</span><b class="cr-q">${x.n}×</b>
    <span class="cr-n"><b>${esc(x.name)}</b><small>${[esc(x.set), x.kind && esc(x.kind), x.any && `<span class="lp-any">${x.any}</span>`].filter(Boolean).join(" · ")}</small></span>
    <span class="lp-tag">${esc(x.grp)}</span><span class="cr-p">${price || "—"}</span></div>`;
}
const lpList = xs => lp.view === "grid" ? `<div class="pk-grid cgrid">${xs.map(lpCard).join("")}</div>` : `<div class="clist">${xs.map(lpCard).join("")}</div>`;

function renderLanding() {
  const want = lpItems("want"), has = lpItems("have"), cnt = xs => xs.reduce((s, x) => s + x.n, 0);
  landing.innerHTML = `
    <div class="lp-hero"><div><h1>Trade with me</h1>
      <p>The cards I'm hunting for, and the ones I can trade away. Got one I'm missing, or want one of mine? Let's trade.</p></div>
      <button class="pill sm" data-lp="share">🔗 Copy link</button></div>
    <div class="seg lp-tabs">${Object.entries(LP_TABS).map(([k, [t]]) =>
      `<button data-lpt="${k}" class="${lp.tab === k ? "on" : ""}">${t}${lp.data ? ` · ${cnt(k === "want" ? want : has)}` : ""}</button>`).join("")}</div>
    <div class="lp-tools"><input id="lp-q" type="search" placeholder="Search by card or set…" autocomplete="off" value="${esc(lp.q)}">
      <div class="seg">${Object.entries(LP_SORT).map(([v, t]) => `<button data-lps="${v}" class="${lp.sort === v ? "on" : ""}">${t}</button>`).join("")}</div>
      <div class="seg">${[["grid", "▦ Grid"], ["list", "☰ List"]].map(([v, t]) => `<button data-lpv="${v}" class="${lp.view === v ? "on" : ""}">${t}</button>`).join("")}</div></div>
    <div class="lp-body"></div>
    <div class="lp-foot"></div>`;
  renderLandingList();
}
function renderLandingList() {
  const body = landing.querySelector(".lp-body"), foot = landing.querySelector(".lp-foot");
  if (!lp.data) return body.innerHTML = `<p class="empty">${lp.err || "Loading the lists…"}</p>`;
  const q = lp.q.toLowerCase(), hit = x => !q || `${x.name} ${x.set}`.toLowerCase().includes(q);
  const all = lpItems(lp.tab), xs = all.filter(hit).sort(LP_SORTERS[lp.sort]);
  let html;
  if (lp.tab === "want") {
    const groups = Object.values(WANT).map(g => [g, xs.filter(x => x.grp === g)]).filter(([g]) => all.some(x => x.grp === g));
    if (lp.grp !== "all" && !groups.some(([g]) => g === lp.grp)) lp.grp = "all";
    html = (groups.length > 1 ? `<div class="chips">${[["all", "All"], ...groups.map(([g]) => [g, g])].map(([v, t]) =>
        `<button class="chip ${lp.grp === v ? "on" : ""}" data-lpg="${esc(v)}">${t}</button>`).join("")}</div>` : "")
      + groups.filter(([g, gx]) => gx.length && (lp.grp === "all" || lp.grp === g)).map(([g, gx]) =>
        `<h3 class="tr-h">${g === WANT.decks ? "For my decks" : g} · ${gx.reduce((s, x) => s + x.n, 0)}</h3>${lpList(gx)}`).join("");
  } else html = xs.length ? lpList(xs) : "";
  body.innerHTML = html || `<p class="empty">${q ? `Nothing matches “${esc(lp.q)}”.`
    : lp.tab === "want" ? "Nothing on the list right now — every card is in. 🎉" : "Nothing up for trade right now."}</p>`;
  foot.textContent = lp.data.updated ? `Updated ${new Date(lp.data.updated).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}` : "";
}
async function loadLanding() {
  if (lp.loading) return; lp.loading = true;
  try {
    const d = await (await fetch(`${SYNC_URL}?public=1`)).json();
    if (!d.ok || !("wants" in d)) throw new Error("not shared");
    lp.data = { trade: d.trade || [], wants: d.wants || [], updated: d.updated || 0 }; lp.err = "";
    store.set("pub", lp.data);
  } catch (e) {
    lp.err = e.message === "not shared" ? "These lists aren't public yet — the owner needs to update the Apps Script (DEPLOY.md)."
      : "Couldn't load the lists — check your connection and reload.";
  }
  lp.loading = false;
  if (document.body.classList.contains("locked")) renderLanding();
}
landing.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.lpt) { lp.tab = d.lpt; lp.q = ""; history.replaceState(null, "", "#" + LP_TABS[d.lpt][1]); return renderLanding() }
  if (d.lps) { lp.sort = d.lps; return renderLanding() }
  if (d.lpv) { store.set("lpView", lp.view = d.lpv); return renderLanding() }
  if (d.lpg) { lp.grp = d.lpg; return renderLandingList() }
  if (d.lp === "share") {
    const url = location.origin + location.pathname + "#" + LP_TABS[lp.tab][1];
    navigator.clipboard.writeText(url).then(() => say("Link copied"), () => say(url));
  }
});
landing.addEventListener("input", e => { if (e.target.id === "lp-q") { lp.q = e.target.value.trim(); renderLandingList() } });

addEventListener("load", drawGsi);
applyLock();

applyPrefs();
render();
pull();
</script>
